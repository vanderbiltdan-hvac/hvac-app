<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <title>HVAC Voice Console</title>
    <style>
        body { background: #f0f2f5; padding-bottom: 50px; }
        .app-header { background: #1a2a6c; color: white; padding: 1rem; margin-bottom: 1rem; }
        .card { margin-bottom: 12px; border-radius: 8px; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card.is-success { border-top: 5px solid #48c774; background-color: #effaf3; }
        .card.is-info { border-top: 5px solid #3298dc; background-color: #f0f6fc; }
        .card.is-warning { border-top: 5px solid #ffdd57; background-color: #fffbeb; }
        .card.is-danger { border-top: 5px solid #f14668; background-color: #feecf0; }
        .mic-btn { cursor: pointer; color: #3298dc; float: right; font-size: 1.2rem; }
        .is-listening { color: #f14668; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="app-header"><h1 class="title is-5 has-text-white" id="main-title">Loading...</h1></div>
    <div class="tabs is-centered is-toggle is-toggle-rounded is-small"><ul id="tab-menu"></ul></div>
    <div class="container px-3"><div id="app-container" class="columns is-multiline is-mobile"></div></div>

    <script>
        // PASTE YOUR NEW WEB APP URL BETWEEN THESE QUOTES
        const API_URL = 'https://script.google.com/macros/s/AKfycbyga0xQiAsxtaSwo7rR7cBwh1zalop1yly0n1dphlc-k4aoEnGwRgk5awU7p9FOavMQ/exec';
        let allData = [];

        async function init() {
            const response = await fetch(API_URL);
            const data = await response.json();
            document.getElementById('main-title').innerText = data.title;
            allData = data.rows;
            const pages = [...new Set(allData.map(row => row.Page))];
            buildMenu(pages);
            renderPage(pages[0]);
        }

        function buildMenu(pages) {
            const menu = document.getElementById('tab-menu');
            pages.forEach(page => {
                const li = document.createElement('li');
                li.id = `tab-${page}`;
                li.innerHTML = `<a onclick="renderPage('${page}')">${page}</a>`;
                menu.appendChild(li);
            });
        }

        function renderPage(pageName) {
            const container = document.getElementById('app-container');
            container.innerHTML = '';
            document.querySelectorAll('#tab-menu li').forEach(li => li.classList.remove('is-active'));
            document.getElementById(`tab-${pageName}`).classList.add('is-active');
            const filtered = allData.filter(row => row.Page === pageName);
            filtered.forEach(item => {
                const col = document.createElement('div');
                col.className = `column is-${item.Width || 12}`;
                col.innerHTML = `<div class="card p-3 ${item.Style || ''}"><label class="label is-size-7">${item.Label} <span class="mic-btn" onclick="startVoice('${item.ID}')" id="mic-${item.ID}">🎤</span></label><input class="input is-small" type="text" id="${item.ID}"></div>`;
                container.appendChild(col);
            });
        }

        function startVoice(inputId) {
            const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new Speech();
            const icon = document.getElementById('mic-' + inputId);
            recognition.onstart = () => icon.classList.add('is-listening');
            recognition.onend = () => icon.classList.remove('is-listening');
            recognition.onresult = (event) => { document.getElementById(inputId).value = event.results[0][0].transcript; };
            recognition.start();
        }
        init();
    </script>
</body>
</html>
