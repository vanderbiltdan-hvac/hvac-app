<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Scratchpad v1.03</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="pages-registry.js"></script>
    <style>
:root {
  --pmi-row-height: 30px;
  --pmi-font-size-label: 10px;
  --pmi-font-size-content: 10px;
  --pmi-label-width: 30%;
  --data-pill-width: 80px;
  --data-pill-height: 40px;
  --action-pill-width: 40px;
  --pill-radius: 8px;
}

.action-pill {
  width: var(--action-pill-width);
  height: var(--data-pill-height);
  border-radius: var(--pill-radius);
  flex-shrink: 0;
}

.data-pill {
  min-width: var(--data-pill-width);
  min-height: var(--data-pill-height);
  border-radius: var(--pill-radius);
  flex-shrink: 0;
}

.pmi-row {
  min-height: var(--pmi-row-height);
  flex-basis: 100%;
  width: 100%;
  display: flex;
  align-items: stretch;
  flex-wrap: nowrap;
  line-height: 1;
}

        .pmi-label {
            width: var(--pmi-label-width);
            font-size: var(--pmi-font-size-label);
            display: flex;
            align-items: center;
            padding-left: 12px;
            padding-right: 12px;
        }

        .content-cell {
            font-size: var(--pmi-font-size-content);
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 12px;
            padding-right: 12px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-slate-900 m-0 p-0 flex flex-col min-h-screen text-white" style="overscroll-behavior-y: contain;">

<!-- STATUS BAR LAUNCHER -->
<div id="top-status-bar" onclick="toggleTopRibbon()" class="w-full bg-slate-900 border-b border-slate-700 flex justify-center items-center px-4 py-2 sticky top-0 z-50 cursor-pointer hover:bg-slate-800 transition-colors shadow-sm">
    <div id="active-job-ticket" class="text-slate-400 font-mono text-[10px] tracking-wider uppercase">[ Awaiting New Call Info ]</div>
</div>

<!-- TOP RIBBON DRAWER (ACCORDION) -->
<div id="top-ribbon-drawer" class="w-full bg-slate-800/95 backdrop-blur-md border-b border-slate-600 flex justify-start overflow-x-auto no-scrollbar gap-3 px-4 py-3 hidden origin-top transition-all duration-300 z-40 sticky top-8 shadow-md">
  <button onclick="createNewJob()" class="action-pill bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center text-xl transition-colors border border-blue-400 shadow-sm" title="New Job">➕</button>
  <button onclick="openDrive()" class="action-pill bg-slate-700 hover:bg-slate-600 text-white flex items-center justify-center text-xl transition-colors border border-slate-500 shadow-sm" title="Drive">📁</button>
  <button onclick="openAlbum()" class="action-pill bg-slate-700 hover:bg-slate-600 text-white flex items-center justify-center text-xl transition-colors border border-slate-500 shadow-sm" title="Album">📷</button>
  <button onclick="openManuals()" class="action-pill bg-slate-700 hover:bg-slate-600 text-white flex items-center justify-center text-xl transition-colors border border-slate-500 shadow-sm" title="Manuals">📖</button>
  <button onclick="toggleMic()" class="action-pill bg-slate-700 hover:bg-slate-600 text-white flex items-center justify-center text-xl transition-colors border border-slate-500 shadow-sm" title="Mic">🎙️</button>
  <button onclick="toggleCalibrationDock()" class="action-pill bg-slate-700 hover:bg-slate-600 text-white flex items-center justify-center text-xl transition-colors border border-slate-500 shadow-sm" title="Settings">⚙️</button>
  <button onclick="clearAllPMIData()" class="action-pill bg-red-900/80 hover:bg-red-700 text-white flex items-center justify-center text-xl transition-colors border border-red-500 shadow-sm" title="Clear Slate">🗑️</button>
</div>

<div id="notes-workspace" class="flex-1 w-full relative bg-slate-900 overflow-hidden" style="background-image: radial-gradient(#334155 1px, transparent 1px); background-size: 20px 20px;">
    <canvas id="scratchpad" class="absolute top-0 left-0 w-full h-full touch-none"></canvas>
    
    <!-- Floating Canvas Controls -->
    <div class="absolute bottom-24 left-0 right-0 flex justify-center gap-4 z-10 px-4 pointer-events-none">
        <div class="flex bg-slate-800 rounded-full shadow-xl border border-slate-600 pointer-events-auto overflow-hidden">
            <button id="btn-pen" onclick="setTool('pen')" class="bg-blue-600 text-white font-bold py-3 px-5 text-xs transition-colors border-r border-slate-600">
                ✏️ PEN
            </button>
            <button id="btn-eraser" onclick="setTool('eraser')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 px-5 text-xs transition-colors">
                🧽 ERASE
            </button>
        </div>
        
        <button onclick="resetCanvas()" class="pointer-events-auto bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 px-4 rounded-full text-xs transition-colors shadow-xl border border-slate-600" title="Flush Canvas">
            🔄
        </button>
        <button onclick="pinScratchpad()" class="pointer-events-auto bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 px-4 rounded-full text-xs transition-colors shadow-xl border border-blue-500" title="Save & Pin">
            💾
        </button>
    </div>
</div>

<!-- Settings Modal (FORMERLY CALIBRATION DOCK) -->
<div id="pmi-calibration-dock"
  class="fixed bottom-20 left-4 right-4 z-50 bg-slate-800/95 backdrop-blur-md border border-slate-600 hidden flex flex-col p-4 transition-all shadow-2xl rounded-xl">
  
  <div class="flex justify-between items-center border-b border-slate-600 pb-2 mb-2">
    <h3 class="text-white text-[10px] font-bold uppercase tracking-widest">Global Settings</h3>
    <button onclick="toggleCalibrationDock()" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
  </div>
  
  <div class="text-slate-500 text-xs italic text-center py-4">
    App settings and integrations coming soon.
  </div>
</div>

<!-- BOTTOM APP NAVIGATION PANEL -->
<div id="bottom-page-nav" class="w-full bg-slate-900 border-t border-slate-700 fixed bottom-0 left-0 z-50 flex flex-col pb-[env(safe-area-inset-bottom,0px)]">
  <!-- Expanded Grid (Hidden by default) -->
  <div id="bottom-nav-grid" class="hidden absolute bottom-full left-0 w-full p-2 bg-slate-900/95 backdrop-blur-md border-t border-slate-700 shadow-[0_-10px_25px_rgba(0,0,0,0.5)] z-50">
    <!-- Dynamic Grid -->
    <div id="bottom-nav-grid-inner" class="grid grid-cols-3 gap-2"></div>
  </div>

  <!-- Launcher / Collapse Control -->
  <div class="flex w-full h-12 bg-slate-800 shrink-0">
    <button onclick="toggleFullScreen()" class="w-[35%] h-full flex items-center justify-center text-slate-300 font-bold text-sm tracking-widest hover:bg-slate-700 transition-colors active:bg-slate-600 border-r border-slate-700">
      <span class="mr-2 text-base">⛶</span> FULLSCREEN
    </button>
    <button id="bottom-nav-launcher" onclick="toggleBottomNav()" class="w-[65%] h-full flex items-center justify-center text-slate-300 font-bold text-sm tracking-widest hover:bg-slate-700 transition-colors active:bg-slate-600">
      <span id="bottom-nav-icon" class="mr-2">☰</span> PAGES
    </button>
  </div>
</div>

<script>
// UNIVERSAL DRAWER FUNCTIONS
function createNewJob() {
    const name = prompt("Enter new Job Name/ID:");
    if(name && name.trim() !== '') document.getElementById('active-job-ticket').innerText = name.trim();
}
function openDrive() { console.log("Google Drive bridge triggered"); }
function openAlbum() { console.log("Photo Album bridge triggered"); }
function openManuals() { console.log("Manuals Database bridge triggered"); }
function toggleMic() { console.log("Microphone triggered"); }
function clearAllPMIData() { resetCanvas(); }
function toggleCalibrationDock() { console.log("Settings triggered"); }
function toggleTopRibbon() {
    document.getElementById('top-ribbon-drawer').classList.toggle('hidden');
}

function getSplashDestination() {
    return location.protocol === "file:" ? "Splash.html" : "index.html";
}

const FALLBACK_PAGES_REGISTRY = [
    { name: "Splash", file: getSplashDestination(), state: "ACTIVE" },
    { name: "Notes", file: "notes.html", state: "ACTIVE" },
    { name: "Mirror", file: "mirror.html", state: "ACTIVE" },
    { name: "Specs", file: "specs.html", state: "PLANNED" },
    { name: "PMI", file: "pmi.html", state: "PLANNED" },
    { name: "Diag", file: "diagnostics.html", state: "ACTIVE" },
    { name: "Startup", file: "startup.html", state: "PLANNED" },
    { name: "Compiler", file: "compiler.html", state: "PLANNED" },
    { name: "Templates", file: "templates.html", state: "PLANNED" },
    { name: "Reports", file: "reports.html", state: "PLANNED" },
    { name: "Data Block", file: "datablock.html", state: "PLANNED" }
];

function getPagesRegistry() {
    if (
        Array.isArray(window.PLATTS_PAGES_REGISTRY) &&
        window.PLATTS_PAGES_REGISTRY.length > 0
    ) {
        return window.PLATTS_PAGES_REGISTRY;
    }

    return FALLBACK_PAGES_REGISTRY;
}

function renderBottomNav() {
    const grid = document.getElementById('bottom-nav-grid-inner');
    if (!grid) return;
    
    let currentPath = window.location.pathname.split('/').pop().toLowerCase();
    if (!currentPath) {
        currentPath = "notes.html";
    }
    
    let html = "";
    const registry = getPagesRegistry();
    registry.forEach(p => {
        let isCurrent = (p.file.toLowerCase() === currentPath);
        
        if (isCurrent) {
            html += `<a href="${p.file}" class="flex flex-col items-center justify-center h-16 bg-blue-900 border-2 border-blue-400 rounded text-white font-bold text-[13px] shadow-sm text-center leading-tight transition-transform active:scale-95">
                ${p.name}<br><span class="text-[10px] font-bold text-blue-200 mt-1 tracking-widest">CURRENT</span>
            </a>`;
        } else if (p.state === "ACTIVE") {
            html += `<a href="${p.file}" class="flex flex-col items-center justify-center h-16 bg-slate-800 border border-slate-600 hover:bg-slate-700 rounded text-slate-100 font-bold text-[13px] shadow-sm text-center leading-tight transition-transform active:scale-95">
                ${p.name}
            </a>`;
        } else {
            html += `<div class="flex flex-col items-center justify-center h-16 bg-slate-900 border border-dashed border-slate-700 rounded text-slate-500 font-bold text-[13px] shadow-none text-center leading-tight opacity-70">
                ${p.name}<br><span class="text-[9px] font-normal text-slate-600 mt-1 uppercase tracking-wider">PLANNED</span>
            </div>`;
        }
    });
    grid.innerHTML = html;
}

function toggleBottomNav() {
    const grid = document.getElementById('bottom-nav-grid');
    const icon = document.getElementById('bottom-nav-icon');
    if (grid.classList.contains('hidden')) {
        grid.classList.remove('hidden');
        icon.textContent = '▲';
    } else {
        grid.classList.add('hidden');
        icon.textContent = '☰';
    }
}

function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else if (document.exitFullscreen) {
        document.exitFullscreen();
    }
}

// CANVAS SCRATCHPAD ENGINE
const canvas = document.getElementById('scratchpad');
const ctx = canvas.getContext('2d');
let isDrawing = false;
let lastX = 0; let lastY = 0;
let saveTimeout;
let currentTool = 'pen';

function setTool(tool) {
    currentTool = tool;
    const penBtn = document.getElementById('btn-pen');
    const eraserBtn = document.getElementById('btn-eraser');
    
    if (tool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 20; // Larger brush for erasing
        penBtn.classList.replace('bg-blue-600', 'bg-slate-800');
        penBtn.classList.replace('text-white', 'text-slate-300');
        eraserBtn.classList.replace('bg-slate-800', 'bg-blue-600');
        eraserBtn.classList.replace('text-slate-300', 'text-white');
    } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = 3;
        eraserBtn.classList.replace('bg-blue-600', 'bg-slate-800');
        eraserBtn.classList.replace('text-white', 'text-slate-300');
        penBtn.classList.replace('bg-slate-800', 'bg-blue-600');
        penBtn.classList.replace('text-slate-300', 'text-white');
    }
}

function initCanvas() {
    // Match internal resolution to physical CSS size to prevent stretching
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#60a5fa'; // High-visibility electric blue ink
    
    loadCanvasState();
}

function startDrawing(e) {
    isDrawing = true;
    const rect = canvas.getBoundingClientRect();
    lastX = e.clientX - rect.left;
    lastY = e.clientY - rect.top;
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
}

// Draw method
function draw(e) {
    if (!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    const currentX = e.clientX - rect.left;
    const currentY = e.clientY - rect.top;

    // Quadratic Curve Interpolation for smooth, non-jagged stylus strokes
    const xc = (lastX + currentX) / 2;
    const yc = (lastY + currentY) / 2;
    ctx.quadraticCurveTo(lastX, lastY, xc, yc);
    ctx.stroke();

    lastX = currentX;
    lastY = currentY;
}

function stopDrawing() {
    if (!isDrawing) return;
    isDrawing = false;
    ctx.lineTo(lastX, lastY);
    ctx.stroke();
    debounceSave();
}

// Data Persistence & Auto-Save
function debounceSave() {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
        localStorage.setItem('hvac_active_scribble', canvas.toDataURL());
    }, 500);
}

function loadCanvasState() {
    const savedData = localStorage.getItem('hvac_active_scribble');
    if (savedData) {
        const img = new Image();
        img.onload = () => { ctx.drawImage(img, 0, 0); };
        img.src = savedData;
    }
}

// Action Pills
function resetCanvas() {
    if(confirm("Flush the scratchpad?")) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        localStorage.removeItem('hvac_active_scribble');
    }
}

function pinScratchpad() {
    const link = document.createElement('a');
    link.download = `hvac_note_${new Date().getTime()}.png`;
    link.href = canvas.toDataURL();
    link.click();
}

// Event Bindings
window.addEventListener('resize', initCanvas);
canvas.addEventListener('pointerdown', startDrawing);
canvas.addEventListener('pointermove', draw);
canvas.addEventListener('pointerup', stopDrawing);
canvas.addEventListener('pointerout', stopDrawing);

window.addEventListener('DOMContentLoaded', () => {
    renderBottomNav();
    initCanvas();
});
</script>
</body>

</html>
