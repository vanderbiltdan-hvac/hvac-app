let currentProfile = null;
const TEMPLATE_VERSION = "v2.02.2";
const COMPILER_PAYLOAD_KEY = "hvac_compiler_payload_v1";

function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.warn(err));
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
}

function updateActiveJobTicket() {
    const job = localStorage.getItem('hvacActiveJob');
    const el = document.getElementById('active-job-ticket');
    if (el) el.innerText = job && job.trim() !== '' ? job.trim() : '[ Awaiting New Call Info ]';
}

function getActiveTemplateProfileId() {
    let lensName = document.getElementById('template-name-select').value;
    if (lensName === 'custom') lensName = document.getElementById('custom-template-name').value.trim() || 'PMI';
    const reportId = document.getElementById('report-target-select').value;
    return `${lensName}::report${reportId}`;
}

function getReportDisplayName(lensName, reportIdStr) {
    const names = JSON.parse(localStorage.getItem('template_report_names_v1') || '{}');
    if (!names[lensName]) return `Report ${reportIdStr.replace('report', '')}`;
    return names[lensName][reportIdStr] || `Report ${reportIdStr.replace('report', '')}`;
}

function setReportDisplayName(lensName, reportIdStr, newName) {
    const names = JSON.parse(localStorage.getItem('template_report_names_v1') || '{}');
    if (!names[lensName]) names[lensName] = {};
    names[lensName][reportIdStr] = newName.trim();
    localStorage.setItem('template_report_names_v1', JSON.stringify(names));
}

function saveCurrentProfile() {
    if (!currentProfile) return;
    const profileId = getActiveTemplateProfileId();
    const profiles = JSON.parse(localStorage.getItem('template_profiles_v2') || '{}');
    profiles[profileId] = currentProfile;
    localStorage.setItem('template_profiles_v2', JSON.stringify(profiles));
}

function loadCompilerPayload() {
    const raw = localStorage.getItem(COMPILER_PAYLOAD_KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch(e) { return null; }
}

function updatePayloadStatus(payload) {
    const el = document.getElementById('template-payload-status');
    if (!el) return;
    if (!payload) { el.innerText = "COMPILER PAYLOAD NOT FOUND"; return; }
    el.innerText = `COMPILER · PAYLOAD v${payload.schema}`;
}

function migrateLegacyProfile(lensName, reportIdStr) {
    let baseFields = [];
    const savedRules = JSON.parse(localStorage.getItem('template_rules_v1') || '{}');
    if (savedRules[lensName]) baseFields = savedRules[lensName];
    
    let newProfile = {
        templateName: lensName,
        reportId: reportIdStr,
        reportName: getReportDisplayName(lensName, reportIdStr),
        sectionOrder: ["specs", "pmi", "diagnostics", "startup", "extras"],
        sections: { specs: [], pmi: [], diagnostics: [], startup: [], extras: [] }
    };
    
    if (reportIdStr === 'report1') {
        const legacySeqStr = localStorage.getItem('template_sequence_v1');
        if (legacySeqStr) {
            const legacySeq = JSON.parse(legacySeqStr);
            let currentDest = "extras";
            legacySeq.forEach(key => {
                if (key === '__HDR_SPECS__') currentDest = 'specs';
                else if (key === '__HDR_PMI__') currentDest = 'pmi';
                else if (key === '__HDR_DIAG__') currentDest = 'diagnostics';
                else if (key === '__HDR_STARTUP__') currentDest = 'startup';
                else if (key === '__HDR_UNIVERSAL__') currentDest = 'extras';
                else {
                    let matchLabel = key;
                    let source = 'extras';
                    let sourceId = key;
                    
                    const m = masterFieldMap.find(mf => mf.split('|')[0].trim() === key || (mf.split('|')[1] && mf.split('|')[1].trim() === key));
                    if (m) {
                        matchLabel = m.split('|')[0].trim();
                        let p = m.split('|')[2]?.trim() || '';
                        if (p==='Specs') source = 'specs';
                        if (p==='PMI') source = 'pmi';
                        if (p==='Diag') source = 'diagnostics';
                        if (p==='Startup') source = 'startup';
                    } else if (key.startsWith('compiler:')) {
                        let parts = key.split(':');
                        source = parts[1];
                        sourceId = parts[2];
                        matchLabel = sourceId;
                    }
                    
                    if (baseFields.length === 0 || baseFields.includes(matchLabel) || baseFields.includes(key)) {
                        newProfile.sections[currentDest].push({
                            label: matchLabel,
                            source: source,
                            sourceId: sourceId,
                            stableKey: key
                        });
                    }
                }
            });
        }
    }
    return newProfile;
}

function initTemplateManager() {
    updateActiveJobTicket();
    const payload = loadCompilerPayload();
    updatePayloadStatus(payload);
    loadCurrentProfile();
}

function loadCurrentProfile() {
    const profileId = getActiveTemplateProfileId();
    const profiles = JSON.parse(localStorage.getItem('template_profiles_v2') || '{}');
    
    let lensName = document.getElementById('template-name-select').value;
    if (lensName === 'custom') lensName = document.getElementById('custom-template-name').value.trim() || 'PMI';
    let reportIdStr = `report${document.getElementById('report-target-select').value}`;
    
    if (profiles[profileId]) {
        currentProfile = profiles[profileId];
        if (!currentProfile.sectionOrder) currentProfile.sectionOrder = ["specs", "pmi", "diagnostics", "startup", "extras"];
    } else {
        currentProfile = migrateLegacyProfile(lensName, reportIdStr);
        saveCurrentProfile();
    }
    
    updateReportSelectorUI();
    renderMainCanvas();
    renderTemplateBuilder();
}

function renderMainCanvas() {
    const list = document.getElementById('template-sort-list');
    if (!list) return;
    if (activeLens === 'Vault Dump') {
        renderVaultDump(list);
        return;
    }
    if (!currentProfile) return;
    
    let html = '';
    let renderedCount = 0;
    const payload = loadCompilerPayload();
    
    currentProfile.sectionOrder.forEach(secKey => {
        const fields = currentProfile.sections[secKey] || [];
        if (fields.length === 0) return; 
        
        let displaySec = secKey.toUpperCase();
        if (secKey === 'extras') displaySec = 'EXTRAS / UNASSIGNED';
        
        html += `
        <details class="w-full bg-slate-800 border border-slate-600 rounded overflow-hidden mt-2 group" open>
            <summary class="flex justify-between items-center bg-slate-700 p-3 text-[10px] text-white font-bold uppercase tracking-widest outline-none select-none">
                <span>${displaySec}</span>
                <span class="text-slate-400 text-xs">▼</span>
            </summary>
            <div class="p-2 flex flex-col gap-1 min-h-[20px]">`;
            
        fields.forEach(field => {
            renderedCount++;
            let val = '---';
            if (payload && payload.sources && payload.sources[field.source]) {
                const srcGroup = payload.sources[field.source];
                const match = srcGroup.items.find(i => i.id === field.sourceId || i.label === field.label);
                if (match) val = match.value !== "" ? match.value : "---";
            } else if (field.source === 'extras') {
                const univSaved = JSON.parse(localStorage.getItem('template_univ_v1') || '{}');
                if (univSaved[field.sourceId]) val = univSaved[field.sourceId].value || 'Manual Entry';
            }
            
            let badge = '';
            let t = field.source.toUpperCase();
            if (t === 'DIAGNOSTICS') badge = `<span class="bg-blue-900/50 text-blue-300 px-1 py-0.5 rounded mr-2 border border-blue-700 text-[8px] shrink-0">DIAG</span>`;
            else if (t === 'PMI') badge = `<span class="bg-emerald-900/50 text-emerald-300 px-1 py-0.5 rounded mr-2 border border-emerald-700 text-[8px] shrink-0">PMI</span>`;
            else if (t === 'STARTUP') badge = `<span class="bg-orange-900/50 text-orange-300 px-1 py-0.5 rounded mr-2 border border-orange-700 text-[8px] shrink-0">STRT</span>`;
            else if (t === 'SPECS') badge = `<span class="bg-cyan-900/50 text-cyan-300 px-1 py-0.5 rounded mr-2 border border-cyan-700 text-[8px] shrink-0">SPEC</span>`;
            else badge = `<span class="bg-purple-900/50 text-purple-300 px-1 py-0.5 rounded mr-2 border border-purple-700 text-[8px] shrink-0">UNIV</span>`;

            html += `
            <div class="template-item-row flex items-stretch w-full box-border border-slate-600 bg-slate-800 rounded overflow-hidden transition-all duration-200">

                        <span class="text-[10px] font-bold text-white uppercase tracking-wider truncate" title="${field.label}">${field.label}</span>

                    <span class="text-[10px] text-blue-300 font-bold text-right leading-tight whitespace-normal flex-1">${val}</span>
                </div>
            </div>`;
        });
        html += `</div></details>`;
    });
    
    if (renderedCount === 0) {
        list.innerHTML = '<div class="text-slate-500 text-xs italic text-center py-6">No fields mapped for this report profile. Open Fields to configure.</div>';
    } else {
        list.innerHTML = html;
    }
}

function renderVaultDump(list) {
    const payload = loadCompilerPayload();
    if (!payload || !payload.sources) {
        list.innerHTML = '<div class="text-slate-500 text-xs italic text-center py-6">No Compiler Payload found.</div>';
        return;
    }
    let html = '';
    ['specs','pmi','diagnostics','startup'].forEach(srcKey => {
        const srcGroup = payload.sources[srcKey];
        if (!srcGroup || !srcGroup.items || srcGroup.items.length === 0) return;
        let displaySec = srcKey.toUpperCase();
        html += `
        <details class="w-full bg-slate-800 border border-slate-600 rounded overflow-hidden mt-2 group" open>
            <summary class="flex justify-between items-center bg-slate-700 p-3 text-[10px] text-white font-bold uppercase tracking-widest outline-none select-none">
                <span>[ VAULT ] ${displaySec}</span>
                <span class="text-slate-400 text-xs">▼</span>
            </summary>
            <div class="p-2 flex flex-col gap-1 min-h-[20px]">`;
        srcGroup.items.forEach(item => {
            if (item.value.trim() === '') return;
            html += `
            <div class="template-item-row flex items-stretch w-full box-border border-slate-600 bg-slate-800 rounded overflow-hidden transition-all duration-200">
                <div class="flex-1 flex justify-between items-center p-2 overflow-hidden gap-2">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider truncate w-1/2">${item.label}</span>
                    <span class="text-[10px] text-blue-300 font-bold text-right leading-tight whitespace-normal flex-1">${item.value}</span>
                </div>
            </div>`;
        });
        html += `</div></details>`;
    });
    list.innerHTML = html;
}

        function savePMIData() {
            localStorage.setItem('pmi_data_v1', JSON.stringify(pmiRegistry));
        }

        function loadPMIData() {
            const saved = localStorage.getItem('pmi_data_v1');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    Object.assign(pmiRegistry, data);

                    Object.keys(pmiRegistry).forEach(category => {
                        const cell = document.querySelector(`.content-cell[data-category="${category}"]`);
                        if (cell) {
                            const label = cell.previousElementSibling;
                            if (pmiRegistry[category].stamped) {
                                label.classList.add('bg-blue-600', 'text-white');
                            }
                            renderCell(category);
                        }
                    });
                } catch (e) {
                    console.error('Failed to load PMI data', e);
                }
            }
        }

        function clearAllPMIData() {
            if (confirm("Are you sure you want to clear the entire ledger?")) {
                Object.keys(pmiRegistry).forEach(key => delete pmiRegistry[key]);
                savePMIData();

                document.querySelectorAll('.pmi-label').forEach(el => el.classList.remove('bg-blue-600', 'text-white'));
                document.querySelectorAll('.content-cell').forEach(el => {
                    el.innerText = '';
                    el.classList.remove('text-blue-300', 'text-xs', 'p-2');
                });
            }
        }

        function clearCategory(category) {
            if (pmiRegistry[category]) {
                pmiRegistry[category].stamped = false;
                pmiRegistry[category].comments = [];
                savePMIData();

                const cell = document.querySelector(`.content-cell[data-category="${category}"]`);
                if (cell) {
                    const label = cell.previousElementSibling;
                    label.classList.remove('bg-blue-600', 'text-white');
                    renderCell(category);
                }
            }
        }

        function toggleBlueStamp(category, element) {
            if (!pmiRegistry[category]) {
                pmiRegistry[category] = { stamped: false, comments: [] };
            }
            pmiRegistry[category].stamped = !pmiRegistry[category].stamped;

            if (pmiRegistry[category].stamped) {
                element.classList.add('bg-blue-600', 'text-white');
            } else {
                element.classList.remove('bg-blue-600', 'text-white');
            }
            savePMIData();
        }

        function openContentLocker(category) {

                pmiRegistry[category] = { stamped: false, comments: [] };

                    editBtn.innerText = "✎";

                    const delBtn = document.createElement('button');
                    delBtn.className = "bg-red-900/60 hover:bg-red-800 text-white p-3 rounded transition-colors text-xs w-10";
                    delBtn.innerText = "×";
                    delBtn.onclick = function () { deleteComment(category, text); };

                    wrapper.appendChild(btn);
                    wrapper.appendChild(editBtn);
                    wrapper.appendChild(delBtn);

            // 2. CUSTOM NOTE ENTRY (MIDDLE ZONE)

        <button onclick="addCustomComment()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-2 rounded text-[10px] uppercase tracking-widest transition-colors shadow-sm">Add</button>
    `;
            contentArea.appendChild(customNoteDiv);

            // 3. SENTENCE BUILDER (BOTTOM COLLAPSIBLE ZONE)

                const builderContainer = document.createElement('div');
                builderContainer.className = "mt-3 flex flex-col gap-2";

                const previewContainer = document.createElement('div');
                previewContainer.className = "bg-slate-900 border border-blue-500 rounded p-3 flex justify-between items-center";

                const previewText = document.createElement('div');

                previewText.className = "text-blue-300 font-bold text-sm italic flex-1";

                const controlsDiv = document.createElement('div');
                controlsDiv.className = "flex gap-2 ml-2";

                const undoBtn = document.createElement('button');
                undoBtn.className = "bg-slate-700 hover:bg-slate-600 text-white px-2 py-1 rounded text-xs transition-colors";
                undoBtn.innerText = "Undo";
                undoBtn.onclick = () => undoWord();

                const clearBtn = document.createElement('button');
                clearBtn.className = "bg-slate-700 hover:bg-slate-600 text-white px-2 py-1 rounded text-xs transition-colors";
                clearBtn.innerText = "Clear";
                clearBtn.onclick = () => clearSentence();

                const commitBtn = document.createElement('button');
                commitBtn.className = "bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1 rounded text-xs transition-colors";
                commitBtn.innerText = "Commit";
                commitBtn.onclick = () => commitSentence(category);

                controlsDiv.appendChild(undoBtn);
                controlsDiv.appendChild(clearBtn);
                controlsDiv.appendChild(commitBtn);
                previewContainer.appendChild(previewText);
                previewContainer.appendChild(controlsDiv);
                builderContainer.appendChild(previewContainer);

                Object.keys(sentenceBlocks[category]).forEach(groupKey => {
                    const blockTitle = document.createElement('div');
                    blockTitle.className = "text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-2 mb-1";
                    blockTitle.innerText = groupKey;
                    builderContainer.appendChild(blockTitle);

                    const blockGrid = document.createElement('div');
                    blockGrid.className = "flex flex-wrap gap-2";

                    sentenceBlocks[category][groupKey].forEach(word => {
                        const wordBtn = document.createElement('button');
                        wordBtn.className = "bg-slate-700 hover:bg-slate-600 border border-slate-600 px-3 py-2 rounded text-white text-xs transition-colors";
                        wordBtn.innerText = word;
                        wordBtn.onclick = () => pushWord(word);

                    });

                });

                details.appendChild(builderContainer);
                contentArea.appendChild(details);
            }

            document.getElementById('pmi-content-modal').classList.remove('hidden');
            document.getElementById('pmi-content-modal').classList.add('flex');
        }

        function toggleComment(category, text, btnElement) {
            const index = pmiRegistry[category].comments.indexOf(text);
            if (index > -1) {
                pmiRegistry[category].comments.splice(index, 1);
                btnElement.classList.remove('border-blue-500', 'bg-blue-900');
            } else {
                pmiRegistry[category].comments.push(text);
                btnElement.classList.add('border-blue-500', 'bg-blue-900');
            }
            savePMIData();
            renderCell(category);
        }

        function renderCell(category) {
            const cell = document.querySelector(`.content-cell[data-category="${category}"]`);
            if (cell && pmiRegistry[category]) {
                if (pmiRegistry[category].comments.length > 0) {
                    cell.innerText = pmiRegistry[category].comments.join(' ');
                    cell.classList.add('text-blue-300', 'text-xs', 'p-2');
                } else {
                    cell.innerText = '';
                    cell.classList.remove('text-blue-300', 'text-xs', 'p-2');
                }
            }
        }

        function closeContentLocker() {
            document.getElementById('pmi-content-modal').classList.add('hidden');
            document.getElementById('pmi-content-modal').classList.remove('flex');
            currentActiveCategory = null;
        }

        function pushWord(word) {
            activeSentence.push(word);
            const preview = document.getElementById('sentence-preview');
            if (preview) preview.innerText = activeSentence.length ? activeSentence.join(' ') + " " : "___";
        }

        function undoWord() {
            activeSentence.pop();
            const preview = document.getElementById('sentence-preview');
            if (preview) preview.innerText = activeSentence.length ? activeSentence.join(' ') + " " : "___";
        }

        function clearSentence() {
            activeSentence = [];
            const preview = document.getElementById('sentence-preview');
            if (preview) preview.innerText = "___";
        }

        function commitSentence(category) {
            const sentence = activeSentence.join(' ').trim();
            if (sentence !== "") {
                // Save permanently to Hub's memory so it survives 'Undo'
                if (!prefabData[category]) prefabData[category] = [];
                if (!prefabData[category].includes(sentence)) {
                    prefabData[category].push(sentence);
                }
                // Push to active ledger row
                if (!pmiRegistry[category].comments.includes(sentence)) {
                    pmiRegistry[category].comments.push(sentence);
                }
                activeSentence = [];
                savePMIData();
                openContentLocker(category);
                renderCell(category);
            }
        }

        function editComment(category, oldText) {
            const newText = prompt("Edit comment:", oldText);
            if (newText !== null && newText.trim() !== "") {
                const cleanNewText = newText.trim();

                const pIndex = prefabData[category].indexOf(oldText);
                if (pIndex > -1) {
                    prefabData[category][pIndex] = cleanNewText;
                }

                if (pmiRegistry[category] && pmiRegistry[category].comments) {
                    const cIndex = pmiRegistry[category].comments.indexOf(oldText);
                    if (cIndex > -1) {
                        pmiRegistry[category].comments[cIndex] = cleanNewText;
                    }
                }
                savePMIData();
                openContentLocker(category);
                renderCell(category);
            }
        }

        function deleteComment(category, text) {
            if (confirm(`Delete comment: "${text}"?`)) {
                const pIndex = prefabData[category].indexOf(text);
                if (pIndex > -1) {
                    prefabData[category].splice(pIndex, 1);
                }

                if (pmiRegistry[category] && pmiRegistry[category].comments) {
                    const cIndex = pmiRegistry[category].comments.indexOf(text);
                    if (cIndex > -1) {
                        pmiRegistry[category].comments.splice(cIndex, 1);
                    }
                }
                savePMIData();
                openContentLocker(category);
                renderCell(category);
            }
        }

        function addCustomComment() {
            const input = document.getElementById('custom-note-input');
            const note = input.value.trim();
            if (note && currentActiveCategory) {
                if (!prefabData[currentActiveCategory]) {
                    prefabData[currentActiveCategory] = [];
                }
                if (!prefabData[currentActiveCategory].includes(note)) {
                    prefabData[currentActiveCategory].push(note);
                }

                if (!pmiRegistry[currentActiveCategory].comments.includes(note)) {
                    pmiRegistry[currentActiveCategory].comments.push(note);
                }

                input.value = '';
                savePMIData();
                openContentLocker(currentActiveCategory);
                renderCell(currentActiveCategory);
            }
        }

                        <button onclick="moveFieldInBuilder('${secKey}', ${fIdx}, 1)" class="bg-slate-700 text-slate-300 hover:text-white px-2 py-1 rounded">▼</button>
                        <button onclick="openMoveFieldDialog('${secKey}', ${fIdx})" class="bg-slate-700 text-blue-300 hover:text-blue-100 px-2 py-1 rounded">MOVE</button>
                        <button onclick="removeFieldFromBuilder('${secKey}', ${fIdx})" class="bg-red-900/60 text-red-300 hover:text-red-100 px-2 py-1 rounded">×</button>
                    </div>
                </div>`;
            });
        }
        
        html += `</div></details>`;
    });
    
    html += `
    <div class="mt-4 border-t border-slate-700 pt-3">
        <div class="text-[9px] text-slate-400 uppercase tracking-widest mb-2 font-bold">Reorder Sections</div>
        <div class="flex flex-col gap-1">`;
    currentProfile.sectionOrder.forEach((secKey, sIdx) => {
        let displaySec = secKey.toUpperCase();
        if (secKey === 'extras') displaySec = 'EXTRAS';
        html += `
        <div class="flex justify-between items-center bg-slate-800 p-2 rounded border border-slate-700 text-[10px] text-white">
            <span>${displaySec}</span>
            <div class="flex gap-1">
                <button onclick="moveSectionOrder(${sIdx}, -1)" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded">▲</button>
                <button onclick="moveSectionOrder(${sIdx}, 1)" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded">▼</button>
            </div>
        </div>`;
    });
    html += `</div></div>`;
    
    canvas.innerHTML = html;
}

let activeLens = 'PMI';

function handleTemplateDropdownChange() {
    const selectEl = document.getElementById('template-name-select');
    const customInput = document.getElementById('custom-template-name');
    if (selectEl.value === 'custom') {
        selectEl.classList.add('hidden');
        customInput.classList.remove('hidden');
        customInput.focus();
    } else {
        selectEl.classList.remove('hidden');
        customInput.classList.add('hidden');
    }
    let lensName = selectEl.value;
    if (lensName === 'custom') lensName = customInput.value.trim() || 'PMI';
    
    if (lensName !== 'PMI' && lensName !== 'No Cool' && lensName !== 'Water Leak' && lensName !== 'Change Out' && lensName !== 'Proposal' && lensName !== 'Miscellaneous') {
        const customNames = JSON.parse(localStorage.getItem('template_custom_names_v1') || '[]');
        if (!customNames.includes(lensName) && lensName.trim() !== '') {
            customNames.push(lensName);
            localStorage.setItem('template_custom_names_v1', JSON.stringify(customNames));
        }
    }
    
    loadCurrentProfile();
    renderLensRow();
}

function renameReport() {
    let lensName = document.getElementById('template-name-select').value;
    if (lensName === 'custom') lensName = document.getElementById('custom-template-name').value.trim() || 'PMI';
    const reportIdStr = `report${document.getElementById('report-target-select').value}`;
    
    const currName = getReportDisplayName(lensName, reportIdStr);
    const newName = prompt(`Enter custom name for ${lensName} ${reportIdStr}:`, currName);
    if (newName && newName.trim() !== '') {
        setReportDisplayName(lensName, reportIdStr, newName);
        if(currentProfile) {
            currentProfile.reportName = newName.trim();
            saveCurrentProfile();
        }
        updateReportSelectorUI();
        renderMainCanvas();
    }
}

function updateReportSelectorUI() {
    const select = document.getElementById('report-target-select');
    if(!select) return;
    let lensName = document.getElementById('template-name-select').value;
    if (lensName === 'custom') lensName = document.getElementById('custom-template-name').value.trim() || 'PMI';
    
    Array.from(select.options).forEach((opt, idx) => {
        const repId = `report${idx+1}`;
        opt.innerText = getReportDisplayName(lensName, repId);
    });
}

function renderLensRow() {
    let row = document.getElementById('template-lens-row');
    if (!row) {
        const listContainer = document.getElementById('template-sort-list');
        row = document.createElement('div');
        row.id = 'template-lens-row';
        row.className = 'flex overflow-x-auto no-scrollbar gap-2 w-full pb-3 border-b border-slate-700 mb-2 shrink-0 px-2';
        listContainer.parentElement.insertBefore(row, listContainer);
    }

    const hardcoded = ['Vault Dump', 'PMI', 'No Cool', 'Water Leak', 'Change Out', 'Proposal', 'Miscellaneous'];
    const customNames = JSON.parse(localStorage.getItem('template_custom_names_v1') || '[]');
    const allLenses = [...hardcoded, ...customNames];

    let html = '';
    allLenses.forEach(lens => {
        const isCustom = customNames.includes(lens);
        const isActive = (lens === activeLens);
        let baseClasses = "flex-shrink-0 px-4 py-2 text-[10px] font-bold uppercase tracking-widest rounded-full transition-colors cursor-pointer select-none outline-none ";

        if (isActive) {
            baseClasses += "bg-blue-600 text-white shadow-md border border-blue-400";
        } else {
            baseClasses += "bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 ";
            if (isCustom) baseClasses += "border-2 border-dashed border-yellow-500";
            else baseClasses += "border border-slate-600";
        }
        html += `<button onclick="switchLens('${lens}')" class="${baseClasses}">${lens}</button>`;
    });
    row.innerHTML = html;
}

function switchLens(lensName) {
    activeLens = lensName;
    localStorage.setItem('template_active_lens_v1', lensName);
    renderLensRow();
    
    if (lensName !== 'Vault Dump') {
        const selectEl = document.getElementById('template-name-select');
        const customInput = document.getElementById('custom-template-name');
        
        const hardcoded = ['PMI', 'No Cool', 'Water Leak', 'Change Out', 'Proposal', 'Miscellaneous'];
        if (hardcoded.includes(lensName)) {
            selectEl.value = lensName;
            selectEl.classList.remove('hidden');
            customInput.classList.add('hidden');
        } else {
            selectEl.value = 'custom';
            customInput.value = lensName;
            selectEl.classList.add('hidden');
            customInput.classList.remove('hidden');
        }
        loadCurrentProfile();
    } else {
        renderMainCanvas();
    }
    
    if (navigator.vibrate) navigator.vibrate(50);
}

let importerDest = '';

function openImporter(destSec) {
    importerDest = destSec;
    let displaySec = destSec.toUpperCase();
    if (destSec === 'extras') displaySec = 'EXTRAS';
    document.getElementById('importer-title').innerText = `Import to ${displaySec}`;
    
    document.getElementById('importer-modal').classList.remove('hidden');
    document.getElementById('importer-modal').classList.add('flex');
    renderImporterList();
}

function closeImporter() {
    document.getElementById('importer-modal').classList.add('hidden');
    document.getElementById('importer-modal').classList.remove('flex');
}

function renderImporterList() {
    const canvas = document.getElementById('importer-list-canvas');
    const sourceKey = document.getElementById('importer-source-select').value;
    
    const payload = loadCompilerPayload();
    let items = [];
    
    if (sourceKey !== 'extras') {
        const sourceMapName = sourceKey === 'diagnostics' ? 'Diag' : (sourceKey === 'specs' ? 'Specs' : (sourceKey === 'pmi' ? 'PMI' : 'Startup'));
        
        masterFieldMap.forEach(itemStr => {
            const parts = itemStr.split('|');
            const label = parts[0] ? parts[0].trim() : '';
            const page = parts[2] ? parts[2].trim() : '';
            
            if (page === sourceMapName) {
                let currVal = '';
                let sourceId = label;
                if (payload && payload.sources && payload.sources[sourceKey]) {
                    const match = payload.sources[sourceKey].items.find(i => i.label === label || i.id === label);
                    if (match) {
                        currVal = match.value || '';
                        sourceId = match.id || label;
                    }
                }
                items.push({ id: sourceId, label: label, value: currVal });
            }
        });
        
        if (payload && payload.sources && payload.sources[sourceKey]) {
            payload.sources[sourceKey].items.forEach(match => {
                if (!items.find(i => i.label === match.label || i.id === match.id)) {
                    items.push({ id: match.id || match.label, label: match.label, value: match.value || '' });
                }
            });
        }
    } else {
        const univSaved = JSON.parse(localStorage.getItem('template_univ_v1') || '{}');
        Object.keys(univSaved).forEach(k => {
            items.push({ id: k, label: univSaved[k].label, value: univSaved[k].value || 'Manual Entry' });
        });
    }
    
    if (items.length === 0) {
        canvas.innerHTML = `<div class="text-slate-500 text-xs italic text-center py-6">No fields mapped for ${sourceKey.toUpperCase()}</div>`;
        return;
    }
    
    let html = '';
    items.forEach(item => {
        const stableKey = `compiler:${sourceKey}:${item.id}`;
        let alreadyMappedDest = null;
        for (const [sec, fields] of Object.entries(currentProfile.sections)) {
            const matchedField = fields.find(f => 
                f.stableKey === stableKey || 
                (f.sourceId === item.id && f.source === sourceKey) ||
                (f.source === sourceKey && f.label === item.label)
            );
            if (matchedField) {
                alreadyMappedDest = sec;
                if (item.id && item.id.trim() !== '' && matchedField.sourceId !== item.id) {
                    matchedField.sourceId = item.id;
                    matchedField.stableKey = `compiler:${sourceKey}:${item.id}`;
                    saveCurrentProfile();
                }
                break;
            }
        }
        
        let actionBtn = '';
        if (alreadyMappedDest) {
            if (alreadyMappedDest === importerDest) {
                actionBtn = `<span class="text-[8px] text-emerald-400 border border-emerald-500/50 px-2 py-1 rounded">ADDED</span>`;
            } else {
                actionBtn = `<button onclick="moveExistingFieldToDest('${alreadyMappedDest}', '${importerDest}', '${item.id.replace(/'/g, "\\'")}', '${sourceKey}')" class="bg-slate-700 hover:bg-slate-600 text-blue-300 px-2 py-1 rounded text-[8px] tracking-widest border border-slate-500 transition-colors shadow">MOVE HERE</button>`;
            }
        } else {
            actionBtn = `<button onclick="importFieldToDest('${item.label.replace(/'/g, "\\'")}', '${sourceKey}', '${item.id.replace(/'/g, "\\'")}', '${stableKey}')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-[10px] tracking-widest font-bold transition-colors shadow">IMPORT</button>`;
        }
        
        const hasVal = item.value !== undefined && item.value.trim() !== '' && item.value !== 'Manual Entry';
        const valBadge = hasVal ? `<span class="bg-emerald-900/50 text-emerald-400 text-[8px] px-1 py-[2px] rounded ml-2 border border-emerald-700/50">VALUE</span>` : '';
        
        html += `
        <div class="flex items-center justify-between bg-slate-900 border border-slate-700 p-2 rounded w-full mb-1">
            <div class="flex items-center w-2/3 overflow-hidden">
                <span class="text-[10px] font-bold text-white truncate max-w-[200px]" title="${item.label}">${item.label}</span>
                ${valBadge}
            </div>
            ${actionBtn}
        </div>`;
    });
    canvas.innerHTML = html;
}

function importFieldToDest(label, source, sourceId, stableKey) {
    if (!currentProfile.sections[importerDest]) currentProfile.sections[importerDest] = [];
    currentProfile.sections[importerDest].push({
        label: label,
        source: source,
        sourceId: sourceId,
        stableKey: stableKey
    });
    saveCurrentProfile();
    renderImporterList();
    renderTemplateBuilder();
    renderMainCanvas();
}

function moveExistingFieldToDest(oldDest, newDest, sourceId, source) {
    let field = null;
    const oldArr = currentProfile.sections[oldDest];
    const idx = oldArr.findIndex(f => f.sourceId === sourceId && f.source === source);
    if (idx !== -1) {
        field = oldArr.splice(idx, 1)[0];
        if (!currentProfile.sections[newDest]) currentProfile.sections[newDest] = [];
        currentProfile.sections[newDest].push(field);
        saveCurrentProfile();
        renderImporterList();
        renderTemplateBuilder();
        renderMainCanvas();
    }
}

function moveFieldInBuilder(secKey, fIdx, dir) {
    const arr = currentProfile.sections[secKey];
    if (dir === -1 && fIdx > 0) {
        const temp = arr[fIdx];
        arr[fIdx] = arr[fIdx-1];
        arr[fIdx-1] = temp;
    } else if (dir === 1 && fIdx < arr.length - 1) {
        const temp = arr[fIdx];
        arr[fIdx] = arr[fIdx+1];
        arr[fIdx+1] = temp;
    }
    saveCurrentProfile();
    renderTemplateBuilder();
    renderMainCanvas();
}

function removeFieldFromBuilder(secKey, fIdx) {
    currentProfile.sections[secKey].splice(fIdx, 1);
    saveCurrentProfile();
    renderTemplateBuilder();
    renderMainCanvas();
}

function moveSectionOrder(sIdx, dir) {
    const arr = currentProfile.sectionOrder;
    if (dir === -1 && sIdx > 0) {
        const temp = arr[sIdx];
        arr[sIdx] = arr[sIdx-1];
        arr[sIdx-1] = temp;
    } else if (dir === 1 && sIdx < arr.length - 1) {
        const temp = arr[sIdx];
        arr[sIdx] = arr[sIdx+1];
        arr[sIdx+1] = temp;
    }
    saveCurrentProfile();
    renderTemplateBuilder();
    renderMainCanvas();
}

let pendingMoveField = null;

function openMoveFieldDialog(secKey, fIdx) {
    pendingMoveField = { secKey, fIdx };
    const optionsDiv = document.getElementById('move-dest-options');
    let html = '';
    currentProfile.sectionOrder.forEach(optSec => {
        if (optSec === secKey) return;
        let displaySec = optSec.toUpperCase();
        if (optSec === 'extras') displaySec = 'EXTRAS';
        html += `<button onclick="confirmMoveField('${optSec}')" class="bg-slate-700 hover:bg-slate-600 text-white p-2 text-xs rounded border border-slate-500">${displaySec}</button>`;
    });
    optionsDiv.innerHTML = html;
    
    document.getElementById('move-dest-modal').classList.remove('hidden');
    document.getElementById('move-dest-modal').classList.add('flex');
}

function closeMoveDestModal() {
    document.getElementById('move-dest-modal').classList.add('hidden');
    document.getElementById('move-dest-modal').classList.remove('flex');
    pendingMoveField = null;
}

function confirmMoveField(destSec) {
    if (!pendingMoveField) return;
    const { secKey, fIdx } = pendingMoveField;
    const field = currentProfile.sections[secKey].splice(fIdx, 1)[0];
    if (!currentProfile.sections[destSec]) currentProfile.sections[destSec] = [];
    currentProfile.sections[destSec].push(field);
    saveCurrentProfile();
    closeMoveDestModal();
    renderTemplateBuilder();
    renderMainCanvas();
}

function injectUniversal(label) {
    const key = 'univ_' + label.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
    let univSaved = JSON.parse(localStorage.getItem('template_univ_v1') || '{}');
    if (!univSaved[key]) {
        univSaved[key] = { label: label, value: 'Manual Entry', type: 'UNIV' };
        localStorage.setItem('template_univ_v1', JSON.stringify(univSaved));
    }
}

function getSplashDestination() {
    return window.location.protocol === 'file:' ? 'Splash.html' : 'index.html';
}

function getQuickStashDestination() {
    return window.location.protocol === 'file:' ? 'Splash.html#quickstash' : 'index.html#quickstash';
}

const FALLBACK_PAGES_REGISTRY = [
    { name: "Splash", file: getSplashDestination(), state: "ACTIVE" },
    { name: "Quick Stash", file: getQuickStashDestination(), state: "ACTIVE" },
    { name: "Notes", file: "notes.html", state: "ACTIVE" },
    { name: "Mirror", file: "mirror.html", state: "ACTIVE" },
    { name: "Specs", file: "specs.html", state: "ACTIVE" },
    { name: "PMI", file: "pmi.html", state: "ACTIVE" },
    { name: "Diag", file: "diagnostics.html", state: "ACTIVE" },
    { name: "Startup", file: "startup.html", state: "ACTIVE" },
    { name: "Compiler", file: "compiler.html", state: "ACTIVE" },
    { name: "Templates", file: "templates.html", state: "ACTIVE" },
    { name: "Reports", file: "reports.html", state: "PLANNED" },
    { name: "Data Block", file: "datablock.html", state: "PLANNED" }
];

function getPagesRegistry() {
    if (window.PLATTS_PAGES_REGISTRY && Array.isArray(window.PLATTS_PAGES_REGISTRY)) {
        return window.PLATTS_PAGES_REGISTRY;
    }
    return FALLBACK_PAGES_REGISTRY;
}

function renderBottomNav() {
    const gridInner = document.getElementById('bottom-nav-grid-inner');
    if (!gridInner) return;
    
    gridInner.innerHTML = '';
    const reg = getPagesRegistry();
    const currentPath = window.location.pathname.toLowerCase();
    
    reg.forEach(page => {
        const btn = document.createElement('button');
        
        let isCurrent = false;
        if (page.name === 'Templates') {
            if (currentPath.endsWith('templates.html')) {
                isCurrent = true;
            }
        }
        
        if (isCurrent) {
            btn.className = "h-14 flex flex-col items-center justify-center bg-slate-700 border-2 border-blue-500 rounded text-white font-bold text-[10px] shadow-sm uppercase tracking-wider";
            btn.innerHTML = `<span>${page.name}</span><span class="text-[8px] text-blue-300 mt-1">CURRENT</span>`;
        } else if (page.state === "ACTIVE") {
            btn.className = "h-14 flex flex-col items-center justify-center bg-slate-800 border border-slate-600 hover:bg-slate-700 rounded text-slate-300 font-bold text-[10px] transition-colors shadow-sm uppercase tracking-wider";
            btn.innerText = page.name;
            btn.onclick = () => {
                let dest = page.file;
                if (page.name === 'Splash') dest = getSplashDestination();
                if (page.name === 'Quick Stash') dest = getQuickStashDestination();
                window.location.href = dest;
            };
        } else {
            btn.className = "h-14 flex flex-col items-center justify-center bg-slate-900 border border-slate-800 rounded text-slate-600 font-bold text-[10px] uppercase tracking-wider cursor-not-allowed";
            btn.innerHTML = `<span>${page.name}</span><span class="text-[8px] text-slate-700 mt-1">PLANNED</span>`;
        }
        
        gridInner.appendChild(btn);
    });
}

function toggleBottomNav() {
    const grid = document.getElementById('bottom-nav-grid');
    const icon = document.getElementById('bottom-nav-icon');
    const launcher = document.getElementById('bottom-nav-launcher');
    const topRibbon = document.getElementById('top-ribbon-drawer');
    
    if (grid.classList.contains('hidden')) {
        grid.classList.remove('hidden');
        icon.innerText = '▼';
        launcher.classList.add('bg-slate-700');
        launcher.classList.remove('bg-slate-800');
        if (topRibbon) topRibbon.classList.add('hidden');
    } else {
        grid.classList.add('hidden');
        icon.innerText = '☰';
        launcher.classList.add('bg-slate-800');
        launcher.classList.remove('bg-slate-700');
    }
}

window.addEventListener('DOMContentLoaded', () => {
    const validLenses = ['Vault Dump', 'PMI', 'No Cool', 'Water Leak', 'Change Out', 'Proposal', 'Miscellaneous'];
    const customNames = JSON.parse(localStorage.getItem('template_custom_names_v1') || '[]');
    const allValid = validLenses.concat(customNames);
    
    let savedLens = localStorage.getItem('template_active_lens_v1');
    if (savedLens && allValid.includes(savedLens)) {
        activeLens = savedLens;
    } else {
        activeLens = 'PMI';
        localStorage.setItem('template_active_lens_v1', 'PMI');
    }

    if (activeLens !== 'Vault Dump') {
        const selectEl = document.getElementById('template-name-select');
        const customInput = document.getElementById('custom-template-name');
        if (validLenses.includes(activeLens)) {
            selectEl.value = activeLens;
        } else {
            selectEl.value = 'custom';
            customInput.value = activeLens;
            selectEl.classList.add('hidden');
            customInput.classList.remove('hidden');
        }
    }

    initTemplateManager();
    renderLensRow();
    renderBottomNav();
});

window.addEventListener('pageshow', (e) => {
    initTemplateManager();
});

window.addEventListener('storage', (e) => {
    if (e.key === 'hvacActiveJob') {
        updateActiveJobTicket();
        loadCurrentProfile();
    }
});
</script>
