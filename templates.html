:root {
  --pmi-row-height: 30px;
  --pmi-font-size-label: 10px;

  --data-pill-width: 80px;

}

.action-pill {
  width: var(--action-pill-width);
  height: var(--data-pill-height);
  border-radius: var(--pill-radius);
  flex-shrink: 0;
}

.data-pill {
  min-width: var(--data-pill-width);
  min-height: var(--data-pill-height);
  border-radius: var(--pill-radius);
  flex-shrink: 0;
}

            min-height: var(--pmi-row-height);

            line-height: 1;

            align-items: center;

            padding-right: 12px;

            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

    <script>
        const prefabData = {
            "Summary": ["System operating normally", "Multiple issues found", "Requires follow-up visit"],
            "Filter": ["Clean", "Dirty", "Changed", "No replacement filter available", "Customer would like new filter delivered"],
            "Evaporator Coil": ["Clean", "Minor buildup", "Dirty", "Major buildup", "Clogged", "Compacted", "Recommended cleaning with no rinse coil spray", "Recommended pull and clean", "Customer opting to leave as is", "Performed pull and clean", "Performed no rinse coil clean"],
            "Blower Visual": ["Clean", "Minor buildup", "Dirty", "Filthy", "Major buildup", "Recommend cleaning", "Customer opting to leave as is"],
            "Blower Mechanical": ["Spinning freely", "Not spinning", "Locked up"],
            "Drain & Pan": ["Cleared drain and pan", "Added algae tabs", "Flushed line with water until flowing clear", "Clogged", "Excessive debris"],
            "Heater": ["Verified heat operational", "Heat not functioning"],
            "Float Switch": [],
            "IAQ": []
        };

        const sentenceBlocks = {
            "Float Switch": {
                Verbs: ["Verified", "Inspected", "Tested"],
                Targets: ["Primary", "Secondary", "Auxiliary Pan", "Float Switch", "Float Switches"],
                Status: ["operational", "not operational", "bypassed"],
                Connectors: ["and", ","]
            },
            "IAQ": {
                Verbs: ["Verified", "Inspected", "Replaced"],
                Targets: ["REME HALO", "UV Light", "Air Scrubber", "bulb"],
                Status: ["operational", "not operational", "replaced", "recommend bulb replacement"],
                Connectors: ["and", ","]
            }
        };
        let activeSentence = [];

        const pmiRegistry = {};
        let currentActiveCategory = null;

let masterSequence = [];
let draggedIndex = null;

const TEMPLATE_VERSION = "v2.00.3";
const COMPILER_PAYLOAD_KEY = "hvac_compiler_payload_v1";

function loadCompilerPayload() {
    const raw = localStorage.getItem(COMPILER_PAYLOAD_KEY);
    if (!raw) return null;
    try {
        return JSON.parse(raw);
    } catch(e) {
        console.warn("Templates: Compiler payload malformed or unreadable.", e);
        return null;
    }
}

function updatePayloadStatus(payload) {
    const el = document.getElementById('template-payload-status');
    const ticket = document.getElementById('active-job-ticket');
    if (!el) return;
    
    if (!payload) {
        el.innerText = "COMPILER PAYLOAD NOT FOUND";
        return;
    }
    if (payload.schema !== "1.0") {
        el.innerText = `COMPILER PAYLOAD SCHEMA ${payload.schema || '?'} — EXPECTED 1.0`;
    } else {
        el.innerText = `COMPILER · ${payload.summary?.active || 0} ACTIVE · PAYLOAD v${payload.schema}`;
    }

    if (payload.job && payload.job.activeJob && payload.job.activeJob.trim() !== '') {
        if (ticket) ticket.innerText = payload.job.activeJob.trim();
    }
}

function resolveLegacyTemplateKey(key, payloadActiveItems) {
    if (!key.startsWith('W')) return null;
    let match = masterFieldMap.find(m => {
        let parts = m.split('|');
        let cell = parts[1] ? parts[1].trim() : "";
        return cell === key;
    });
    if (!match) return null;
    let parts = match.split('|');
    let label = parts[0] ? parts[0].trim() : "";
    let page = parts[2] ? parts[2].trim() : "";
    
    let sourceKey = "";
    if (page === 'Specs') sourceKey = 'specs';
    else if (page === 'PMI') sourceKey = 'pmi';
    else if (page === 'Diag') sourceKey = 'diagnostics';
    else if (page === 'Startup') sourceKey = 'startup';
    
    if (!sourceKey) return null;
    
    let activeMatches = payloadActiveItems.filter(i => i.source === sourceKey && i.label === label);
    if (activeMatches.length === 1) {
        return activeMatches[0].key;
    }
    return null;
}

function initTemplateManager() {
    const payload = loadCompilerPayload();
    updatePayloadStatus(payload);

    const rawItems = {};
    rawItems['__HDR_SPECS__'] = { label: 'Specs', isHeader: true, group: 'specs' };
    rawItems['__HDR_PMI__'] = { label: 'PMI', isHeader: true, group: 'pmi' };
    rawItems['__HDR_DIAG__'] = { label: 'Diagnostics', isHeader: true, group: 'diagnostics' };
    rawItems['__HDR_STARTUP__'] = { label: 'Startup', isHeader: true, group: 'startup' };
    rawItems['__HDR_UNIVERSAL__'] = { label: 'Universal', isHeader: true, group: 'univ' };

    const payloadActiveItems = []; 

    if (payload && payload.sources) {
        ['specs', 'pmi', 'diagnostics', 'startup'].forEach(sourceKey => {
            const sourceGroup = payload.sources[sourceKey];
            if (sourceGroup && sourceGroup.items) {
                sourceGroup.items.forEach(item => {
                    if (item.active === true) {
                        const stableKey = `compiler:${sourceKey}:${item.id}`;
                        rawItems[stableKey] = {
                            key: stableKey,
                            label: item.label,
                            value: item.value !== "" ? item.value : "SELECTED",
                            type: sourceKey === 'diagnostics' ? 'DIAG' : sourceKey.toUpperCase(),
                            source: sourceKey,
                            sourceId: item.id,
                            active: true
                        };
                        payloadActiveItems.push(rawItems[stableKey]);
                    }
                });
            }
        });
    }

    const univSaved = JSON.parse(localStorage.getItem('template_univ_v1') || '{}');
    Object.keys(univSaved).forEach(key => { rawItems[key] = univSaved[key]; });

    const savedSeq = localStorage.getItem('template_sequence_v1');
    if (savedSeq) {
        let parsedSeq = [...new Set(JSON.parse(savedSeq).flat())];
        
        masterSequence = parsedSeq.map(key => {
            if (key.startsWith('__HDR_') || key.startsWith('univ_') || key.startsWith('compiler:')) {
                return key;
            }
            
            let resolvedKey = resolveLegacyTemplateKey(key, payloadActiveItems);
            if (resolvedKey) return resolvedKey;
            
            let match = payloadActiveItems.find(i => i.sourceId === key);
            if (!match) {
                const labelMatches = payloadActiveItems.filter(i => i.label === key);
                if (labelMatches.length === 1) match = labelMatches[0];
            }
            
            if (match) {
                return match.key;
            } else {
                console.warn(`Templates: unresolved legacy sequence key preserved: ${key}`);
                return key;
            }
        });
        
        masterSequence = [...new Set(masterSequence)];
        
        const missingByHeader = {};
        payloadActiveItems.forEach(item => {
            if (!masterSequence.includes(item.key)) {
                const hdrKey = `__HDR_${item.type === 'DIAG' ? 'DIAG__' : (item.type === 'STARTUP' ? 'STARTUP__' : (item.type === 'SPECS' ? 'SPECS__' : 'PMI__'))}`;
                if (!missingByHeader[hdrKey]) missingByHeader[hdrKey] = [];
                missingByHeader[hdrKey].push(item.key);
            }
        });
        
        Object.keys(missingByHeader).forEach(hdrKey => {
            const itemsToInsert = missingByHeader[hdrKey];
            let hdrIndex = masterSequence.indexOf(hdrKey);
            if (hdrIndex === -1) {
                masterSequence.push(hdrKey);
                masterSequence.push(...itemsToInsert);
            } else {
                let insertAt = masterSequence.length;
                for (let i = hdrIndex + 1; i < masterSequence.length; i++) {
                    if (masterSequence[i].startsWith('__HDR_')) {
                        insertAt = i;
                        break;
                    }
                }
                masterSequence.splice(insertAt, 0, ...itemsToInsert);
            }
        });
    } else {
        masterSequence = [];
        ['specs', 'pmi', 'diagnostics', 'startup'].forEach(sourceKey => {
            const items = payloadActiveItems.filter(i => i.source === sourceKey);
            if (items.length > 0) {
                masterSequence.push(`__HDR_${sourceKey === 'diagnostics' ? 'DIAG__' : (sourceKey === 'startup' ? 'STARTUP__' : (sourceKey === 'specs' ? 'SPECS__' : 'PMI__'))}`);
                items.forEach(i => masterSequence.push(i.key));
            }
        });
    }
    
    localStorage.setItem('template_sequence_v1', JSON.stringify(masterSequence));

    const list = document.getElementById('template-sort-list');
    let inDetails = false;
    let layoutHtml = '';

    const activeHeaderMap = {
        '__HDR_SPECS__': payloadActiveItems.some(i => i.source === 'specs'),
        '__HDR_PMI__': payloadActiveItems.some(i => i.source === 'pmi'),
        '__HDR_DIAG__': payloadActiveItems.some(i => i.source === 'diagnostics'),
        '__HDR_STARTUP__': payloadActiveItems.some(i => i.source === 'startup'),
        '__HDR_UNIVERSAL__': Object.keys(univSaved).length > 0
    };

    let renderedCount = 0;

    masterSequence.forEach((key, index) => {
        const item = rawItems[key];
        
        if (key.startsWith('compiler:') && !item) return;
        if (!key.startsWith('__HDR_') && !key.startsWith('univ_') && !key.startsWith('compiler:') && !item) return;

        if (item && item.isHeader) {
            if (!activeHeaderMap[key]) return; 
            if (inDetails) layoutHtml += `</div></details>`;
            layoutHtml += `
            <details class="w-full bg-slate-800 border border-slate-600 rounded overflow-hidden mt-2 group" open data-index="${index}" ondragover="handleDragOver(event)" ondrop="handleDrop(event)" ondragenter="handleDragEnter(event)" ondragleave="handleDragLeave(event)">
                <summary class="flex justify-between items-center bg-slate-700 p-3 text-[10px] text-white font-bold uppercase tracking-widest cursor-pointer outline-none select-none transition-colors group-hover:bg-slate-600" draggable="true" data-index="${index}" ondragstart="handleDragStart(event)" ondragend="handleDragEnd(event)">
                    <div class="flex items-center gap-2">
                        <span class="text-slate-400 cursor-grab hover:text-white px-2" style="touch-action: none;" onpointerdown="initTouchDrag(event, ${index})">⋮⋮</span>
                        <span>${item.label}</span>
                    </div>
                    <span class="text-slate-400 text-xs">▼</span>
                </summary>
                <div class="p-2 flex flex-col gap-1 min-h-[20px]">`;
            inDetails = true;
        } else if (item) {
            renderedCount++;
            if (!inDetails) {
                layoutHtml += `<div class="p-2 flex flex-col gap-1 w-full min-h-[20px]">`;
                inDetails = true;
            }
            let badge = '';
            if (item.type === 'DIAG') badge = `<span class="bg-blue-900/50 text-blue-300 px-1 py-0.5 rounded mr-2 border border-blue-700 text-[8px] shrink-0">DIAG</span>`;
            else if (item.type === 'PMI') badge = `<span class="bg-emerald-900/50 text-emerald-300 px-1 py-0.5 rounded mr-2 border border-emerald-700 text-[8px] shrink-0">PMI</span>`;
            else if (item.type === 'STARTUP') badge = `<span class="bg-orange-900/50 text-orange-300 px-1 py-0.5 rounded mr-2 border border-orange-700 text-[8px] shrink-0">STRT</span>`;
            else if (item.type === 'SPECS') badge = `<span class="bg-cyan-900/50 text-cyan-300 px-1 py-0.5 rounded mr-2 border border-cyan-700 text-[8px] shrink-0">SPEC</span>`;
            else badge = `<span class="bg-purple-900/50 text-purple-300 px-1 py-0.5 rounded mr-2 border border-purple-700 text-[8px] shrink-0">UNIV</span>`;

            const isMapped = masterFieldMap.some(m => {
                let [rawLabel] = m.split('|');
                let lbl = rawLabel ? rawLabel.trim() : "";
                return lbl === item.label || lbl === item.sourceId;
            });
            const orphanClass = isMapped ? 'border-slate-600 bg-slate-800' : 'border-orange-500 bg-orange-900/30';
            const orphanTextClass = isMapped ? 'text-white' : 'text-orange-300';

            layoutHtml += `
            <div class="template-item-row flex items-stretch w-full box-border ${orphanClass} rounded overflow-hidden transition-all duration-200" data-label="${item.label}" data-key="${item.key || key}" draggable="true" data-index="${index}" ondragstart="handleDragStart(event)" ondragover="handleDragOver(event)" ondrop="handleDrop(event)" ondragenter="handleDragEnter(event)" ondragleave="handleDragLeave(event)" ondragend="handleDragEnd(event)">
                <div class="flex items-center justify-center px-3 text-slate-500 cursor-grab hover:text-white active:cursor-grabbing bg-slate-900/50 border-r border-slate-700 select-none" style="touch-action: none;" onpointerdown="initTouchDrag(event, ${index})">⋮⋮</div>
                <div class="flex-1 flex justify-between items-center p-2 overflow-hidden gap-2">
                    <div class="flex items-center w-1/2 overflow-hidden pr-2">

// NATIVE HTML5 DRAG & DROP ENGINE
function handleDragStart(e) {
    draggedIndex = parseInt(e.currentTarget.getAttribute('data-index'));
    e.currentTarget.style.opacity = '0.4';
    e.dataTransfer.effectAllowed = 'move';
}
function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; return false; }
function handleDragEnter(e) { e.preventDefault(); e.currentTarget.classList.add('border-blue-500'); }
function handleDragLeave(e) { e.currentTarget.classList.remove('border-blue-500'); }
function handleDrop(e) {
    e.stopPropagation();
    const targetIndex = parseInt(e.currentTarget.getAttribute('data-index'));
    if (draggedIndex !== null && draggedIndex !== targetIndex) {
        const movedItem = masterSequence.splice(draggedIndex, 1)[0];
        masterSequence.splice(targetIndex, 0, movedItem);
        localStorage.setItem('template_sequence_v1', JSON.stringify(masterSequence));
        initTemplateManager();
    }
    return false;
}
function handleDragEnd(e) {
    e.currentTarget.style.opacity = '1';
    document.querySelectorAll('[draggable="true"]').forEach(row => row.classList.remove('border-blue-500'));
}

// TOUCH/MOBILE REORDER ENGINE
let touchDragIndex = null;
let touchDragElement = null;
let touchStartY = 0;
let touchCurrentY = 0;

function initTouchDrag(e, index) {
    if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
    
    e.preventDefault();
    e.stopPropagation();

    touchDragIndex = index;
    touchDragElement = e.target.closest('details.group, .template-item-row');
    if (!touchDragElement) return;

    touchStartY = e.clientY;
    touchDragElement.style.opacity = '0.5';
    touchDragElement.style.position = 'relative';
    touchDragElement.style.zIndex = '1000';
    
    document.addEventListener('pointermove', handleTouchMove, { passive: false });
    document.addEventListener('pointerup', handleTouchEnd);
    document.addEventListener('pointercancel', handleTouchEnd);
}

function handleTouchMove(e) {
    if (!touchDragElement) return;
    e.preventDefault();
    touchCurrentY = e.clientY - touchStartY;
    touchDragElement.style.transform = `translateY(${touchCurrentY}px)`;
}

function handleTouchEnd(e) {
    if (!touchDragElement) return;

    document.removeEventListener('pointermove', handleTouchMove);
    document.removeEventListener('pointerup', handleTouchEnd);
    document.removeEventListener('pointercancel', handleTouchEnd);

    touchDragElement.style.opacity = '1';
    touchDragElement.style.transform = 'none';
    touchDragElement.style.position = '';
    touchDragElement.style.zIndex = '';

    const dropTarget = document.elementFromPoint(e.clientX, e.clientY);
    const targetEl = dropTarget ? dropTarget.closest('details.group, .template-item-row') : null;
    
    if (targetEl && targetEl.hasAttribute('data-index')) {
        const targetIndex = parseInt(targetEl.getAttribute('data-index'));
        if (touchDragIndex !== null && touchDragIndex !== targetIndex) {
            const movedItem = masterSequence.splice(touchDragIndex, 1)[0];
            masterSequence.splice(targetIndex, 0, movedItem);
            localStorage.setItem('template_sequence_v1', JSON.stringify(masterSequence));
            initTemplateManager();
        }
    }
    
    touchDragElement = null;
    touchDragIndex = null;
}

                    Object.keys(pmiRegistry).forEach(category => {

        function toggleComment(category, text, btnElement) {
            const index = pmiRegistry[category].comments.indexOf(text);
            if (index > -1) {
                pmiRegistry[category].comments.splice(index, 1);
                btnElement.classList.remove('border-blue-500', 'bg-blue-900');
            } else {
                pmiRegistry[category].comments.push(text);
                btnElement.classList.add('border-blue-500', 'bg-blue-900');
            }
            savePMIData();
            renderCell(category);
        }

        function renderCell(category) {
            const cell = document.querySelector(`.content-cell[data-category="${category}"]`);
            if (cell && pmiRegistry[category]) {
                if (pmiRegistry[category].comments.length > 0) {
                    cell.innerText = pmiRegistry[category].comments.join(' ');
                    cell.classList.add('text-blue-300', 'text-xs', 'p-2');
                } else {
                    cell.innerText = '';
                    cell.classList.remove('text-blue-300', 'text-xs', 'p-2');
                }
            }
        }

        function closeContentLocker() {
            document.getElementById('pmi-content-modal').classList.add('hidden');
            document.getElementById('pmi-content-modal').classList.remove('flex');
            currentActiveCategory = null;
        }

        function pushWord(word) {
            activeSentence.push(word);
            const preview = document.getElementById('sentence-preview');
            if (preview) preview.innerText = activeSentence.length ? activeSentence.join(' ') + " " : "___";
        }

        function undoWord() {
            activeSentence.pop();
            const preview = document.getElementById('sentence-preview');
            if (preview) preview.innerText = activeSentence.length ? activeSentence.join(' ') + " " : "___";
        }

        function clearSentence() {
            activeSentence = [];
            const preview = document.getElementById('sentence-preview');
            if (preview) preview.innerText = "___";
        }

        function commitSentence(category) {
            const sentence = activeSentence.join(' ').trim();
            if (sentence !== "") {
                // Save permanently to Hub's memory so it survives 'Undo'
                if (!prefabData[category]) prefabData[category] = [];
                if (!prefabData[category].includes(sentence)) {
                    prefabData[category].push(sentence);
                }
                // Push to active ledger row
                if (!pmiRegistry[category].comments.includes(sentence)) {
                    pmiRegistry[category].comments.push(sentence);
                }
                activeSentence = [];
                savePMIData();
                openContentLocker(category);
                renderCell(category);
            }
        }

        function editComment(category, oldText) {
            const newText = prompt("Edit comment:", oldText);
            if (newText !== null && newText.trim() !== "") {
                const cleanNewText = newText.trim();

                const pIndex = prefabData[category].indexOf(oldText);
                if (pIndex > -1) {
                    prefabData[category][pIndex] = cleanNewText;
                }

                if (pmiRegistry[category] && pmiRegistry[category].comments) {
                    const cIndex = pmiRegistry[category].comments.indexOf(oldText);
                    if (cIndex > -1) {
                        pmiRegistry[category].comments[cIndex] = cleanNewText;
                    }
                }
                savePMIData();
                openContentLocker(category);
                renderCell(category);
            }
        }

        function deleteComment(category, text) {
            if (confirm(`Delete comment: "${text}"?`)) {
                const pIndex = prefabData[category].indexOf(text);
                if (pIndex > -1) {
                    prefabData[category].splice(pIndex, 1);
                }

                if (pmiRegistry[category] && pmiRegistry[category].comments) {
                    const cIndex = pmiRegistry[category].comments.indexOf(text);
                    if (cIndex > -1) {
                        pmiRegistry[category].comments.splice(cIndex, 1);
                    }
                }
                savePMIData();
                openContentLocker(category);
                renderCell(category);
            }
        }

        function addCustomComment() {
            const input = document.getElementById('custom-note-input');
            const note = input.value.trim();
            if (note && currentActiveCategory) {
                if (!prefabData[currentActiveCategory]) {
                    prefabData[currentActiveCategory] = [];
                }
                if (!prefabData[currentActiveCategory].includes(note)) {
                    prefabData[currentActiveCategory].push(note);
                }

                if (!pmiRegistry[currentActiveCategory].comments.includes(note)) {
                    pmiRegistry[currentActiveCategory].comments.push(note);
                }

                input.value = '';
                savePMIData();
                openContentLocker(currentActiveCategory);
                renderCell(currentActiveCategory);
            }
        }

function renderTemplateBuilder() {
    const canvas = document.getElementById('template-builder-canvas');
    if (!canvas) return;

    const groupedData = {};
    masterFieldMap.forEach(item => {
        // Use array destructuring to safely separate the 3 parts without bracket indices
        let [rawLabel, rawCell, rawPage] = item.split('|');

        let label = rawLabel ? rawLabel.trim() : "Unknown";
        let page = rawPage ? rawPage.trim() : "Unassigned Fields";

        if (!groupedData[page]) groupedData[page] = [];
        groupedData[page].push(label);
    });

    let html = '';
    for (const [page, fields] of Object.entries(groupedData)) {
        html += `
        <details class="w-full bg-slate-800 border border-slate-600 rounded overflow-hidden shrink-0" open>
            <summary class="bg-slate-700 p-3 text-[10px] text-white font-bold uppercase tracking-widest cursor-pointer select-none outline-none">
                [ ${page} ]
            </summary>
            <div class="p-2 flex flex-col gap-1">`;

        fields.forEach(label => {
            const isStamped = activeTemplateSelection.has(label) ? 'bg-blue-600 text-white shadow-sm border-blue-500' : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500';
            html += `<div class="pmi-label field-label w-full text-[10px] font-bold border rounded cursor-pointer transition-colors py-2 px-3 select-none ${isStamped}" onclick="toggleTemplateStamp('${label}', this)">${label}</div>`;
        });

        html += `</div></details>`;
    }
    canvas.innerHTML = html;
}

function toggleTemplateStamp(label, element) {
    if (activeTemplateSelection.has(label)) {
        activeTemplateSelection.delete(label);
        element.className = "pmi-label field-label w-full text-[10px] font-bold border rounded cursor-pointer transition-colors py-2 px-3 select-none bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500";
    } else {
        activeTemplateSelection.add(label);
        element.className = "pmi-label field-label w-full text-[10px] font-bold border rounded cursor-pointer transition-colors py-2 px-3 select-none bg-blue-600 text-white shadow-sm border-blue-500";
    }
    if (navigator.vibrate) navigator.vibrate(50);
}

let activeLens = 'Vault Dump';

function handleTemplateDropdownChange(selectEl) {
    const customInput = document.getElementById('custom-template-name');
    if (selectEl.value === 'custom') {
        selectEl.classList.add('hidden');
        customInput.classList.remove('hidden');
        customInput.focus();
        activeTemplateSelection.clear();
    } else {
        selectEl.classList.remove('hidden');
        customInput.classList.add('hidden');
        loadTemplateRuleset(selectEl.value);
    }
    renderTemplateBuilder();
}

function loadTemplateRuleset(lensName) {
    activeTemplateSelection.clear();
    const savedRules = JSON.parse(localStorage.getItem('template_rules_v1') || '{}');
    if (savedRules[lensName]) {
        savedRules[lensName].forEach(lbl => activeTemplateSelection.add(lbl));
    }
}

function saveTemplateLens() {
    const selectEl = document.getElementById('template-name-select');
    const customInput = document.getElementById('custom-template-name');
    let lensName = selectEl.value;
    let isCustom = false;

    if (lensName === 'custom') {
        lensName = customInput.value.trim();
        if (!lensName) { alert("Please enter a custom template name."); return; }
        isCustom = true;
    }

    const savedRules = JSON.parse(localStorage.getItem('template_rules_v1') || '{}');
    savedRules[lensName] = Array.from(activeTemplateSelection);
    localStorage.setItem('template_rules_v1', JSON.stringify(savedRules));

    if (isCustom) {
        const customNames = JSON.parse(localStorage.getItem('template_custom_names_v1') || '[]');
        if (!customNames.includes(lensName)) {
            customNames.push(lensName);
            localStorage.setItem('template_custom_names_v1', JSON.stringify(customNames));
        }
    }

    selectEl.classList.remove('hidden');
    customInput.classList.add('hidden');
    customInput.value = '';
    selectEl.value = isCustom ? 'PMI' : lensName;

    activeLens = lensName;
    renderLensRow();
    applyLensFilter();
    toggleEditFieldsModal();
}

function renderLensRow() {
    let row = document.getElementById('template-lens-row');
    if (!row) {
        const listContainer = document.getElementById('template-sort-list');
        row = document.createElement('div');
        row.id = 'template-lens-row';
        row.className = 'flex overflow-x-auto no-scrollbar gap-2 w-full pb-3 border-b border-slate-700 mb-2 shrink-0 px-2';
        listContainer.parentElement.insertBefore(row, listContainer);
    }

    const hardcoded = ['Vault Dump', 'PMI', 'No Cool', 'Water Leak', 'Change Out', 'Proposal', 'Miscellaneous'];
    const customNames = JSON.parse(localStorage.getItem('template_custom_names_v1') || '[]');
    const allLenses = [...hardcoded, ...customNames];

    let html = '';
    allLenses.forEach(lens => {
        const isCustom = customNames.includes(lens);
        const isActive = (lens === activeLens);
        let baseClasses = "flex-shrink-0 px-4 py-2 text-[10px] font-bold uppercase tracking-widest rounded-full transition-colors cursor-pointer select-none outline-none ";

        if (isActive) {
            baseClasses += "bg-blue-600 text-white shadow-md border border-blue-400";
        } else {
            baseClasses += "bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 ";
            if (isCustom) baseClasses += "border-2 border-dashed border-yellow-500";
            else baseClasses += "border border-slate-600";
        }
        html += `<button onclick="switchLens('${lens}')" class="${baseClasses}">${lens}</button>`;
    });
    row.innerHTML = html;
}

function switchLens(lensName) {
    activeLens = lensName;
    renderLensRow();
    applyLensFilter();
    if (navigator.vibrate) navigator.vibrate(50);
}

function applyLensFilter() {
    const rows = document.querySelectorAll('.template-item-row');
    const details = document.querySelectorAll('details.group');
    const list = document.getElementById('template-sort-list');

    let emptyMsg = document.getElementById('lens-empty-message');
    if (emptyMsg) emptyMsg.remove();

    if (activeLens === 'Vault Dump') {
        rows.forEach(r => r.style.display = 'flex');
        details.forEach(d => d.style.display = 'block');
        return;
    }

    const savedRules = JSON.parse(localStorage.getItem('template_rules_v1') || '{}');
    const allowedFields = savedRules[activeLens] || [];

    if (allowedFields.length === 0) {
        rows.forEach(r => r.style.display = 'none');
        details.forEach(d => d.style.display = 'none');
        
        emptyMsg = document.createElement('div');
        emptyMsg.id = 'lens-empty-message';
        emptyMsg.className = "text-orange-400 font-bold text-[10px] uppercase tracking-widest text-center py-10 px-4 border border-orange-900/50 bg-orange-900/20 rounded mt-4 mx-2";
        emptyMsg.innerText = `NO FIELDS SELECTED FOR ${activeLens.toUpperCase()} — USE FIELDS TO CONFIGURE THIS TEMPLATE`;
        list.appendChild(emptyMsg);
        return;
    }

    rows.forEach(r => {
        const label = r.getAttribute('data-label');
        const key = r.getAttribute('data-key');
        if (allowedFields.includes(label) || allowedFields.includes(key)) {
            r.style.display = 'flex';
        } else {
            r.style.display = 'none';
        }
    });

    details.forEach(d => {
        const visibleRows = d.querySelectorAll('.template-item-row[style="display: flex;"]');
        d.style.display = visibleRows.length > 0 ? 'block' : 'none';
    });
}

function injectUniversal(label) {
    const key = 'univ_' + label.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
    if (!masterSequence.includes('__HDR_UNIVERSAL__')) masterSequence.push('__HDR_UNIVERSAL__');
    
    if (!masterSequence.includes(key)) {
        masterSequence.push(key);
        let univSaved = JSON.parse(localStorage.getItem('template_univ_v1') || '{}');
        univSaved[key] = { label: label, value: 'Manual Entry', type: 'UNIV' };
        localStorage.setItem('template_univ_v1', JSON.stringify(univSaved));
        localStorage.setItem('template_sequence_v1', JSON.stringify(masterSequence));
        initTemplateManager();
        toggleEditFieldsModal();
    }
}

function getSplashDestination() {
    return window.location.protocol === 'file:' ? 'Splash.html' : 'index.html';
}

function getQuickStashDestination() {
    return window.location.protocol === 'file:' ? 'Splash.html#quickstash' : 'index.html#quickstash';
}

const FALLBACK_PAGES_REGISTRY = [
    { name: "Splash", file: getSplashDestination(), state: "ACTIVE" },
    { name: "Quick Stash", file: getQuickStashDestination(), state: "ACTIVE" },
    { name: "Notes", file: "notes.html", state: "ACTIVE" },
    { name: "Mirror", file: "mirror.html", state: "ACTIVE" },
    { name: "Specs", file: "specs.html", state: "ACTIVE" },
    { name: "PMI", file: "pmi.html", state: "ACTIVE" },
    { name: "Diag", file: "diagnostics.html", state: "ACTIVE" },
    { name: "Startup", file: "startup.html", state: "ACTIVE" },
    { name: "Compiler", file: "compiler.html", state: "ACTIVE" },
    { name: "Templates", file: "templates.html", state: "PLANNED" },
    { name: "Reports", file: "reports.html", state: "PLANNED" },
    { name: "Data Block", file: "datablock.html", state: "PLANNED" }
];

function getPagesRegistry() {
    if (window.PLATTS_PAGES_REGISTRY && Array.isArray(window.PLATTS_PAGES_REGISTRY)) {
        return window.PLATTS_PAGES_REGISTRY;
    }
    return FALLBACK_PAGES_REGISTRY;
}

function renderBottomNav() {
    const gridInner = document.getElementById('bottom-nav-grid-inner');
    if (!gridInner) return;
    
    gridInner.innerHTML = '';
    const reg = getPagesRegistry();
    const currentPath = window.location.pathname.toLowerCase();
    
    reg.forEach(page => {
        const btn = document.createElement('button');
        
        let isCurrent = false;
        if (page.name === 'Templates') {
            if (currentPath.endsWith('templates.html')) {
                isCurrent = true;
            }
        }
        
        if (isCurrent) {
            btn.className = "h-14 flex flex-col items-center justify-center bg-slate-700 border-2 border-blue-500 rounded text-white font-bold text-[10px] shadow-sm uppercase tracking-wider";
            btn.innerHTML = `<span>${page.name}</span><span class="text-[8px] text-blue-300 mt-1">CURRENT</span>`;
        } else if (page.state === "ACTIVE") {
            btn.className = "h-14 flex flex-col items-center justify-center bg-slate-800 border border-slate-600 hover:bg-slate-700 rounded text-slate-300 font-bold text-[10px] transition-colors shadow-sm uppercase tracking-wider";
            btn.innerText = page.name;
            btn.onclick = () => {
                let dest = page.file;
                if (page.name === 'Splash') dest = getSplashDestination();
                if (page.name === 'Quick Stash') dest = getQuickStashDestination();
                window.location.href = dest;
            };
        } else {
            btn.className = "h-14 flex flex-col items-center justify-center bg-slate-900 border border-slate-800 rounded text-slate-600 font-bold text-[10px] uppercase tracking-wider cursor-not-allowed";
            btn.innerHTML = `<span>${page.name}</span><span class="text-[8px] text-slate-700 mt-1">PLANNED</span>`;
        }
        
        gridInner.appendChild(btn);
    });
}

function toggleBottomNav() {
    const grid = document.getElementById('bottom-nav-grid');
    const icon = document.getElementById('bottom-nav-icon');
    const launcher = document.getElementById('bottom-nav-launcher');
    const topRibbon = document.getElementById('top-ribbon-drawer');
    
    if (grid.classList.contains('hidden')) {
        grid.classList.remove('hidden');
        icon.innerText = '▼';
        launcher.classList.add('bg-slate-700');
        launcher.classList.remove('bg-slate-800');
        if (topRibbon) topRibbon.classList.add('hidden');
    } else {
        grid.classList.add('hidden');
        icon.innerText = '☰';
        launcher.classList.add('bg-slate-800');
        launcher.classList.remove('bg-slate-700');
    }
}

// Modify the bootloader to render the modal builder instead
window.addEventListener('DOMContentLoaded', () => {
    initTemplateManager();
    loadTemplateRuleset(document.getElementById('template-name-select').value);
    renderTemplateBuilder();
    renderLensRow();
    renderBottomNav();
});

window.addEventListener('pageshow', (e) => {
    initTemplateManager();
});
</script>
