<script>
// LIVE MIRROR BRIDGE (v1.17.1)
let currentJob = localStorage.getItem('hvacActiveJob') || null;
let mirrorState = {};
let liveMirrorSchema = [];
let liveMirrorPMI = [];
let liveMirrorConflict = "";
let liveMirrorInvoiceReport = "";
let mirrorUsingFallback = true;

function getSafeJobKey(job) {
    if (!job) return null;
    let safe = job.trim();
    safe = safe.replace(/[^a-zA-Z0-9]+/g, '_');
    safe = safe.replace(/^_+|_+$/g, '');
    return safe || null;
}



function getUIStateKey() {
    if (!currentJob) return null;
    const safeJob = getSafeJobKey(currentJob);
    if (!safeJob) return null;
    return `mirror_ui_state_v1::${safeJob}`;
}


function loadUIState() {
    if (!currentJob) return { stamped: {}, locked: {} };
    
    const safeJob = getSafeJobKey(currentJob);
    if (!safeJob) return { stamped: {}, locked: {} };
    
    const newKey = `mirror_ui_state_v1::${safeJob}`;
    const legacyKey = `mirror_ui_state_v1::${currentJob}`;
    
    let raw = localStorage.getItem(newKey);
    let isLegacy = false;
    
    if (!raw) {
        raw = localStorage.getItem(legacyKey);
        if (raw) isLegacy = true;
    }
    
    if (!raw) return { stamped: {}, locked: {} };
    
    try {
        const state = JSON.parse(raw) || { stamped: {}, locked: {} };
        if (isLegacy) {
            localStorage.setItem(newKey, JSON.stringify(state));
        }
        return state;
    } catch (e) {
        return { stamped: {}, locked: {} };
    }
}

function saveUIState(state) {
    const key = getUIStateKey();
    if (key) localStorage.setItem(key, JSON.stringify(state));
}

function applyMirrorUIState() {
    const state = loadUIState();
    
    let migrated = false;
    if (Object.keys(state.stamped || {}).length > 0 && window.PLATTS_MIRROR_DATA) {
        const migratableCanonicalLabels = [];
        Object.keys(state.stamped).forEach(id => {
            if (state.stamped[id]) {
                const labelEl = document.getElementById('label-' + id);
                let labelStr = id;
                if (labelEl) {
                    const span = labelEl.querySelector('span:first-child');
                    if (span) labelStr = span.innerText;
                }
                const canonical = window.PLATTS_MIRROR_DATA.getCanonicalLabel(labelStr);
                if (canonical) {
                    migratableCanonicalLabels.push(canonical);
                    migrated = true;
                }
            }
        });
        if (migrated) {
            state.stamped = {};
            saveUIState(state);
            migratableCanonicalLabels.forEach(canonical => {
                window.PLATTS_MIRROR_DATA.setAccepted(canonical, true);
            });
        }
    }

    const rows = document.querySelectorAll('.radar-row');
    rows.forEach(row => {
        const id = row.id.replace('row-', '');
        const labelEl = document.getElementById('label-' + id);
        if (!labelEl) return;
        
        let labelStr = id;
        const span = labelEl.querySelector('span:first-child');
        if (span) labelStr = span.innerText;
        
        const isAcc = window.PLATTS_MIRROR_DATA ? window.PLATTS_MIRROR_DATA.isAccepted(labelStr) : false;
        
        if (isAcc) {
            labelEl.classList.remove('border-blue-400', 'border-l-2');
            labelEl.classList.add('bg-blue-600', 'text-white', 'shadow-sm'); 
        } else {
            labelEl.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
            if (row.getAttribute('data-populated') === 'true') {
                labelEl.classList.add('border-blue-400', 'border-l-2');
            } else {
                labelEl.classList.remove('border-blue-400', 'border-l-2');
            }
        }
    });

    Object.keys(state.locked || {}).forEach(id => {
        if (state.locked[id]) {
            const labelEl = document.getElementById('label-' + id);
            const lockEl = document.getElementById('lock-' + id);
            if (labelEl && lockEl) {
                labelEl.classList.add('bg-blue-800', 'shadow-inner', 'text-slate-200');
                lockEl.classList.remove('hidden');
            }
        }
    });
}



function updateActiveJobTicket() {
    currentJob = localStorage.getItem('hvacActiveJob') || null;
    const ticket = document.getElementById('active-job-ticket');
    if (ticket) ticket.innerText = currentJob ? currentJob : "[ Awaiting New Call Info ]";
}

// UNIVERSAL DRAWER FUNCTIONS
function createNewJob() {
    const name = prompt("Enter new Job Name/ID:");
    if(name && name.trim() !== '') document.getElementById('active-job-ticket').innerText = name.trim();
}
function toggleEditFieldsModal() {
    const modal = document.getElementById('edit-fields-modal');
    modal.classList.toggle('hidden');
    modal.classList.toggle('flex');
}

async function mirrorSync() {
    currentJob = localStorage.getItem('hvacActiveJob') || null;
    updateActiveJobTicket();
    
    if (window.PLATTS_MIRROR_DATA && typeof window.PLATTS_MIRROR_DATA.refresh === "function") {
        try {
            const data = await window.PLATTS_MIRROR_DATA.refresh();
            if (!data.currentJob) {
                mirrorUsingFallback = true;
                initRadar();
                alert("No active job selected.");
                return;
            }
            
            mirrorState = data.fields;
            liveMirrorSchema = data.schema;
            liveMirrorPMI = data.pmi;
            liveMirrorConflict = data.conflict;
            liveMirrorInvoiceReport = data.invoiceReport || "";
            mirrorUsingFallback = false;
            initRadar();
        } catch (e) {
            console.error("Mirror pull failed via shared engine:", e);
            if (mirrorUsingFallback) initRadar();
            alert("Mirror pull failed: " + e.message);
        }
    } else {
        if (!currentJob) {
            mirrorUsingFallback = true;
            initRadar();
            alert("No active job selected.");
            return;
        }
        alert("Shared mirror engine not available.");
    }
}

function acceptAllMirrorValues() {
    if (window.PLATTS_MIRROR_DATA) {
        const count = window.PLATTS_MIRROR_DATA.acceptAllPopulated();
        if (navigator.vibrate) navigator.vibrate([1]);
        applyMirrorUIState();
        alert(`Accepted ${count} populated Mirror values.`);
    }
}

function clearAcceptedMirrorValues() {
    if (window.PLATTS_MIRROR_DATA) {
        const state = loadUIState();
        const lockedIds = Object.keys(state.locked || {});
        
        const lockedLabels = [];
        lockedIds.forEach(id => {
            if (state.locked[id]) {
                const labelEl = document.getElementById('label-' + id);
                let labelStr = id;
                if (labelEl) {
                    const span = labelEl.querySelector('span:first-child');
                    if (span) labelStr = span.innerText;
                }
                const canonical = window.PLATTS_MIRROR_DATA.getCanonicalLabel(labelStr);
                if (canonical) {
                    lockedLabels.push(canonical);
                }
            }
        });
        
        const count = window.PLATTS_MIRROR_DATA.clearAllAccepted(lockedLabels);
        if (navigator.vibrate) navigator.vibrate([1]);
        applyMirrorUIState();
        alert(`Clear Accepted Complete! ${count} records were successfully unaccepted.`);
    }
}

}

// GROUPING METADATA ONLY - Used to organize fields visually. Does not dictate field existence.

  "Fan Results": "Diag", "Capacitor Results": "Diag", "Capacitor Replaced": "Diag",

};

function makeMirrorDomId(label, index) {
    return 'LIVE_' + label.replace(/[^a-zA-Z0-9]/g, '_') + '_' + index;
}

function formatMirrorDisplayValue(label, value) {
    if (value === null || value === undefined || (typeof value === 'string' && value.trim() === '')) {
        return value;
    }
    if (label.toLowerCase() === 'compression ratio' || label.toLowerCase() === 'evap td') {
        const num = Number(value);
        if (!isNaN(num)) return num.toFixed(2);
    }
    return value;
}

function initRadar() {
  const workspace = document.getElementById('mirror-workspace');
  workspace.innerHTML = ''; 

  const groupedData = { "Unassigned Fields": [] };
  
  let activeSchema = liveMirrorSchema;
  let engineFields = mirrorState;
  
  if (window.PLATTS_MIRROR_DATA && typeof window.PLATTS_MIRROR_DATA.getActiveSchema === 'function') {
      const live = window.PLATTS_MIRROR_DATA.getActiveSchema();
      if (live && live.length > 0) activeSchema = live;
  }
  
  if (activeSchema.length > 0) {
      activeSchema.forEach((label, index) => {
          const page = labelToGroup[label] || "Unassigned Fields";
          const id = makeMirrorDomId(label, index);
          
          let val = '';
          if (window.PLATTS_MIRROR_DATA && typeof window.PLATTS_MIRROR_DATA.getField === 'function') {
              val = window.PLATTS_MIRROR_DATA.getField(label) || '';
          } else {
              val = engineFields[label] || '';
          }
          
          if (!groupedData[page]) groupedData[page] = [];
          groupedData[page].push({ id, label, val });
      });
  } else {
      groupedData["Unassigned Fields"].push({ id: makeMirrorDomId("No Data", 0), label: "No Data", val: "" });
  }

  let isFirst = true;

  // Helper to render an accordion and its fields
  function renderAccordion(page, fields, isOrphan) {
    if (fields.length === 0) return;

    let populatedCount = 0;
    fields.forEach(item => {
        if (item.val !== null && item.val !== undefined && String(item.val).trim() !== '') {
            populatedCount++;
        }
    });

    const headerColor = isOrphan ? "bg-orange-900/80 border-orange-500 text-orange-200" : "bg-slate-700 border-slate-600 text-white";
    const icon = isOrphan ? "⚠️ " : "";

    let accordionHtml = `
      <details class="w-full bg-slate-800 border border-slate-600 rounded overflow-hidden" ${isFirst ? 'open' : ''}>
        <summary class="${headerColor} p-3 text-[10px] font-bold uppercase tracking-widest cursor-pointer select-none">
          ${icon}${page} &middot; ${populatedCount}
        </summary>
        <div class="p-2 flex flex-col gap-1">
    `;

    fields.forEach(item => {
      const hasData = item.val !== null && item.val !== undefined && String(item.val).trim() !== '';
      const displayVal = formatMirrorDisplayValue(item.label, item.val);
      
      // Calm the Orange Rows: both orphan and normal use standard slate-gray style
      let labelClasses = "w-[30%] text-[10px] font-bold border-r border-slate-700 cursor-pointer transition-all flex justify-between items-center px-3 relative select-none";
      if (hasData) labelClasses += " border-blue-400 border-l-2";

      accordionHtml += `
        <div id="row-${item.id}" class="radar-row flex items-stretch w-full box-border bg-slate-800 border border-slate-700 rounded overflow-hidden h-10" data-populated="${hasData}">
          <div id="label-${item.id}" class="${labelClasses}"
               style="-webkit-user-select: none; -webkit-touch-callout: none;"
               oncontextmenu="return false;"
               onpointerdown="startPress(event, '${item.id}')"
               onpointerup="endPress(event, '${item.id}')"
               onpointerleave="cancelPress(event)">
            <span class="z-10 pointer-events-none">${item.label}</span>
            <span id="lock-${item.id}" class="z-10 text-[8px] pointer-events-none hidden">🔒</span>
          </div>
          <input type="text" id="input-${item.id}" class="flex-1 bg-slate-700 text-slate-300 font-mono text-[10px] px-3 focus:outline-none focus:bg-slate-600" value="${displayVal}" placeholder="Awaiting..." readonly>
          <button onclick="clearRow('${item.id}')" class="w-8 bg-slate-700 hover:bg-slate-600 border-l border-slate-600 text-slate-400 hover:text-white flex items-center justify-center transition-colors text-xs">⟲</button>
        </div>`;
    });

    accordionHtml += `</div></details>`;
    workspace.innerHTML += accordionHtml;
    isFirst = false;
  }

  // Render Invoice / Final Report first
  const reportHasData = liveMirrorInvoiceReport && liveMirrorInvoiceReport.trim() !== "";
  const reportStatus = reportHasData ? "AVAILABLE" : "";
  const reportContent = reportHasData ? 
    `<div class="text-slate-300 text-xs leading-relaxed whitespace-pre-wrap overflow-y-auto max-h-[300px] bg-slate-700/50 p-3 rounded border border-slate-600/50">${liveMirrorInvoiceReport}</div>` : 
    `<div class="text-slate-400 text-xs italic text-center py-4">No report data available.</div>`;
  const reportTitle = reportStatus ? `INVOICE / FINAL REPORT &middot; ${reportStatus}` : `INVOICE / FINAL REPORT`;

  let invoiceHtml = `
    <details class="w-full bg-slate-800 border border-slate-600 rounded overflow-hidden">
      <summary class="bg-indigo-900/80 border-indigo-500 text-indigo-200 p-3 text-[10px] font-bold uppercase tracking-widest cursor-pointer select-none border-b border-transparent">
        ${reportTitle}
      </summary>
      <div class="p-3 flex flex-col gap-1 bg-slate-800">
        ${reportContent}
      </div>
    </details>
  `;
  workspace.innerHTML += invoiceHtml;

  // Render standard categories next
  const preferredOrder = ["Specs", "Diagnostics", "Diag", "PMI", "Startup"];
  
  preferredOrder.forEach(page => {
      if (groupedData[page]) {
          renderAccordion(page, groupedData[page], false);
      }
  });

  for (const [page, fields] of Object.entries(groupedData)) {
    if (page !== "Unassigned Fields" && !preferredOrder.includes(page)) {
      renderAccordion(page, fields, false);
    }
  }

  // Render Unassigned Fields at the absolute bottom
  const unassigned = groupedData["Unassigned Fields"] || [];
  renderAccordion("Unassigned Fields", unassigned, true);
  
  applyMirrorUIState();
  toggleRadarView('populated');
}

// 2-Tap Smart Label & Long-Press Lock Engine
let pressTimer;
let isLongPress = false;

function startPress(e, id) {
    isLongPress = false;
    pressTimer = setTimeout(() => {
        isLongPress = true;
        triggerMechanicalLock(id);
    }, 1000); // 1-Second Long-Press
}

function endPress(e, id) {
    if (pressTimer) clearTimeout(pressTimer);
    if (!isLongPress) handleSmartTap(id);
}

function cancelPress(e) {
    if (pressTimer) clearTimeout(pressTimer);
}

function triggerMechanicalLock(id) {
    // 1. Audio Click (Web Audio API)
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        osc.type = 'square'; 
        osc.frequency.setValueAtTime(150, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.015);
        osc.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.015);
    } catch(e) {}
    
    // 2. Haptic Buzz (Vibration API)
    if (navigator.vibrate) navigator.vibrate(50);
    
    // 3. Visual Flash & Inset Lock State
    const label = document.getElementById('label-' + id);
    const lock = document.getElementById('lock-' + id);
    
    label.style.backgroundColor = '#ffffff'; // Instant Flash
    setTimeout(() => {
        label.style.backgroundColor = '';
        label.classList.toggle('bg-blue-800');
        label.classList.toggle('shadow-inner');
        label.classList.toggle('text-slate-200');
        lock.classList.toggle('hidden');
        
        const state = loadUIState();
        if (!lock.classList.contains('hidden')) {
            state.locked[id] = true;
        } else {
            delete state.locked[id];
        }
        saveUIState(state);
    }, 150);
}

function handleSmartTap(id) {
    const labelEl = document.getElementById('label-' + id);
    if (!labelEl) return;
    
    let labelStr = id;
    const span = labelEl.querySelector('span:first-child');
    if (span) labelStr = span.innerText;
    
    if (window.PLATTS_MIRROR_DATA) {
        const currentlyAccepted = window.PLATTS_MIRROR_DATA.isAccepted(labelStr);
        window.PLATTS_MIRROR_DATA.setAccepted(labelStr, !currentlyAccepted);
    }
    
    applyMirrorUIState();
}

function clearRow(id) {
    const labelEl = document.getElementById('label-' + id);
    const input = document.getElementById('input-' + id);
    
    let labelStr = id;
    const span = labelEl.querySelector('span:first-child');
    if (span) labelStr = span.innerText;

    labelEl.className = "w-[30%] text-[10px] font-bold border-r border-slate-700 cursor-pointer transition-all flex justify-between items-center px-3 relative select-none";
    document.getElementById('lock-' + id).classList.add('hidden');
    input.value = '';
    
    const state = loadUIState();
    delete state.locked[id];
    saveUIState(state);
    
    if (window.PLATTS_MIRROR_DATA) {
        window.PLATTS_MIRROR_DATA.setAccepted(labelStr, false);
    }
    
    input.closest('.radar-row').setAttribute('data-populated', 'false');
    applyMirrorUIState();
}

// Radar View Logic
function toggleRadarView(mode) {
    const btnAll = document.getElementById('view-all-btn');
    const btnPop = document.getElementById('view-pop-btn');
    const rows = document.querySelectorAll('.radar-row');

    if (mode === 'all') {
        btnAll.classList.replace('bg-slate-800', 'bg-blue-600'); btnAll.classList.replace('text-slate-400', 'text-white');
        btnPop.classList.replace('bg-blue-600', 'bg-slate-800'); btnPop.classList.replace('text-white', 'text-slate-400');
        rows.forEach(r => r.style.display = 'flex');
    } else {
        btnPop.classList.replace('bg-slate-800', 'bg-blue-600'); btnPop.classList.replace('text-slate-400', 'text-white');
        btnAll.classList.replace('bg-blue-600', 'bg-slate-800'); btnAll.classList.replace('text-white', 'text-slate-400');
        rows.forEach(r => {
            r.style.display = r.getAttribute('data-populated') === 'true' ? 'flex' : 'none';
        });
    }
}

function getSplashDestination() {
    return location.protocol === "file:" ? "Splash.html" : "index.html";
}

const FALLBACK_PAGES_REGISTRY = [
    { name: "Splash", file: getSplashDestination(), state: "ACTIVE" },
    { name: "Notes", file: "notes.html", state: "ACTIVE" },
    { name: "Mirror", file: "mirror.html", state: "ACTIVE" },
    { name: "Specs", file: "specs.html", state: "ACTIVE" },
    { name: "PMI", file: "pmi.html", state: "ACTIVE" },
    { name: "Diag", file: "diagnostics.html", state: "ACTIVE" },
    { name: "Startup", file: "startup.html", state: "ACTIVE" },
    { name: "Compiler", file: "compiler.html", state: "ACTIVE" },
    { name: "Templates", file: "templates.html", state: "ACTIVE" },
    { name: "Reports", file: "reports.html", state: "PLANNED" },
    { name: "Data Block", file: "datablock.html", state: "PLANNED" }
];

function getPagesRegistry() {
    if (
        Array.isArray(window.PLATTS_PAGES_REGISTRY) &&
        window.PLATTS_PAGES_REGISTRY.length > 0
    ) {
        return window.PLATTS_PAGES_REGISTRY;
    }

    return FALLBACK_PAGES_REGISTRY;
}

function renderBottomNav() {
    const grid = document.getElementById('bottom-nav-grid-inner');
    if (!grid) return;
    
    let currentPath = window.location.pathname.split('/').pop().toLowerCase();
    if (!currentPath) {
        currentPath = "mirror.html";
    }
    
    let html = "";
    const registry = getPagesRegistry();
    registry.forEach(p => {
        let isCurrent = (p.file.toLowerCase() === currentPath);
        
        if (isCurrent) {
            html += `<a href="${p.file}" class="flex flex-col items-center justify-center h-16 bg-blue-900 border-2 border-blue-400 rounded text-white font-bold text-[13px] shadow-sm text-center leading-tight transition-transform active:scale-95">
                ${p.name}<br><span class="text-[10px] font-bold text-blue-200 mt-1 tracking-widest">CURRENT</span>
            </a>`;
        } else if (p.state === "ACTIVE") {
            html += `<a href="${p.file}" class="flex flex-col items-center justify-center h-16 bg-slate-800 border border-slate-600 hover:bg-slate-700 rounded text-slate-100 font-bold text-[13px] shadow-sm text-center leading-tight transition-transform active:scale-95">
                ${p.name}
            </a>`;
        } else {
            html += `<div class="flex flex-col items-center justify-center h-16 bg-slate-900 border border-dashed border-slate-700 rounded text-slate-500 font-bold text-[13px] shadow-none text-center leading-tight opacity-70">
                ${p.name}<br><span class="text-[9px] font-normal text-slate-600 mt-1 uppercase tracking-wider">PLANNED</span>
            </div>`;
        }
    });
    grid.innerHTML = html;
}

function toggleBottomNav() {
    const grid = document.getElementById('bottom-nav-grid');
    const icon = document.getElementById('bottom-nav-icon');
    if (grid.classList.contains('hidden')) {
        grid.classList.remove('hidden');
        icon.textContent = '▲';
    } else {
        grid.classList.add('hidden');
        icon.textContent = '☰';
    }
}

function toggleFullScreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
            localStorage.setItem('hvacFullscreenPreferred', 'true');
        }).catch(err => {
            console.log(`Error attempting to enable fullscreen: ${err.message}`);
        });
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
            localStorage.setItem('hvacFullscreenPreferred', 'false');
        }
    }
}

window.addEventListener('DOMContentLoaded', () => { 
    renderBottomNav();
    currentJob = localStorage.getItem('hvacActiveJob') || null;
    updateActiveJobTicket();
    
    // mirror-data.js restores cached snapshots synchronously.
    // We can immediately render what we have.
    initRadar();
});

window.addEventListener('storage', (e) => {
    if (e.key === 'hvacActiveJob') {
        currentJob = e.newValue || null;
        updateActiveJobTicket();
        // mirror-data.js storage listener handles snapshot restoring automatically.
    }
});

window.addEventListener('platts-mirror-updated', (e) => {
    if (e.detail && e.detail.currentJob === currentJob) {
        initRadar();
    }
});

window.addEventListener('platts-mirror-acceptance-changed', (e) => {
    if (e.detail && e.detail.currentJob === currentJob) {
        applyMirrorUIState();
    }
});
</script>
